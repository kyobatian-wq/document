<section id="prd-01" class="prd-section"><div class="prd-sectionhead"><span>01</span><h2>背景与目标</h2></div><p>现有站点后台已展示月结账单、费用汇总、收款信息及平台抽成明细。本次补齐上游的总控管理能力，由总控统一配置各商户的抽成比例及费用，生成账单并下发至对应站点，形成可追溯的月结流程。</p><div class="prd-callout"><b>核心目标：</b>总控可配置、计算、核对与下发；站点可查看、核对与导出；同一账单在两端的金额、规则版本和结清状态保持一致。</div><table><thead><tr><th>依据</th><th>已知信息</th><th>使用方式</th></tr></thead><tbody><tr><td>现页确认</td><td>地区、商户、账单状态、生成日期；开版费、抵扣、维护费、抽成、低消和合计金额</td><td>保留原有账务字段与业务含义，新增明确的账期标识</td></tr><tr><td>现页确认</td><td>2026-11-01 生成账单对应 2026-10-01 至 2026-10-31；PG 抽成方式为游戏盈利、比例 5.5%</td><td>区分“账期”和“生成日期”，平台级配置抽成比例</td></tr><tr><td>方案设计</td><td>总控配置、草稿重算、下发锁定、到账登记、操作记录</td><td>作为本次新增流程评审，不视为现网已有能力</td></tr></tbody></table></section>
<section id="prd-02" class="prd-section"><div class="prd-sectionhead"><span>02</span><h2>范围与角色权限</h2></div><div class="notice"><b>两端字段口径：</b>总控后台将“地区 / 商户”拆为“地区、厅主名称、站点名称”。原商户值 762、763、768 在总控对应站点名称；站点后台保留原“地区 / 商户”字段。厅主名称来自站点所属厅主，当前使用“演示厅主 A / B”模拟，其中 A 对应 762、763，B 对应 768，须在正式接入时替换为真实关系。</div><p><b>一期建议范围：</b>单商户月结配置、单账期生成及重算、单笔下发、两端查询导出、全额结清登记及操作留痕。自动定时出账、批量下发、部分付款、在线收款、逾期停服、账单撤回、冲销调账均不在本原型范围。</p><table><thead><tr><th>能力</th><th>总控配置人员</th><th>总控财务人员</th><th>站点人员</th></tr></thead><tbody><tr><td>查询账单 / 查看明细 / 导出</td><td>按授权商户</td><td>按授权商户</td><td>仅所属商户已下发账单</td></tr><tr><td>配置比例、费用、生效账期</td><td>可操作</td><td>按权限授权</td><td>不可操作</td></tr><tr><td>生成 / 重算草稿</td><td>按权限授权</td><td>可操作</td><td>不可操作，也不可见草稿</td></tr><tr><td>下发账单</td><td>按权限授权</td><td>可操作</td><td>不可操作</td></tr><tr><td>登记结清</td><td>按权限授权</td><td>可操作</td><td>只读查看结清结果</td></tr><tr><td>查看内部配置变更日志</td><td>按权限授权</td><td>按权限授权</td><td>不可查看</td></tr></tbody></table><p class="prd-caption">以上为建议权限拆分。当前原型以一个“总控管理员”合并演示；生产环境必须在接口层校验角色与商户范围，不能依赖按钮隐藏。PRD 说明入口属于评审辅助，正式站点后台是否保留另行确认。</p></section>
<section id="prd-03" class="prd-section"><div class="prd-sectionhead"><span>03</span><h2>流程与状态</h2></div><ol><li><b>配置：</b>总控选择商户，设置平台比例、费用及生效账期，填写修改原因后保存新版本。</li><li><b>确认月度汇率：</b>总控选择已结束账期，输入并确认巴西 BRL/USDT 月度结算汇率；确认动作只保存汇率，不计算账单。</li><li><b>计算：</b>选择站点和账期，自动读取已确认的月度汇率、适用配置及平台月结统计，计算并保存待下发账单和快照。未确认汇率不得计算。</li><li><b>核对：</b>核对账期、平台明细、抽成、低消、抵扣、汇率及收款信息。配置或月度汇率版本变化后需重新计算适用草稿。</li><li><b>下发：</b>确认商户和应付金额后下发；站点可见，账单锁定。</li><li><b>结清：</b>财务核实线下到账，录入足额实收与凭证，账单转为已结清；站点同步只读展示。</li></ol><table><thead><tr><th>状态</th><th>总控可操作</th><th>站点展示</th><th>流转限制</th></tr></thead><tbody><tr><td><span class="status draft">草稿</span></td><td>查看、导出、重算、下发</td><td>不可见</td><td>允许重算并增加账单版本；下发成功后变为待结清</td></tr><tr><td><span class="status sent">待结清</span></td><td>查看、导出、登记结清</td><td>可查询及查看明细</td><td>不可重算、覆盖或重复下发；足额到账后变为已结清</td></tr><tr><td><span class="status paid">已结清</span></td><td>查看、导出、查看登记信息</td><td>可查询及查看结清信息</td><td>禁止直接修改金额、状态和结清凭证</td></tr></tbody></table><p>“已下发”是可见性条件，覆盖待结清与已结清两种状态。下发失败时仍为草稿，不得向站点展示半成品；重试必须先核对服务端实际结果。</p></section>
<section id="prd-04" class="prd-section"><div class="prd-sectionhead"><span>04</span><h2>总控后台页面与交互</h2></div><h3>MC-01 · 账单配置</h3><p>入口：月结账单 → 账单配置。列表展示地区、厅主名称、站点名称、平台规则数量、维护费、月低消、汇率“按月确认”提示、生效账期及配置版本。点击“编辑比例与费用”打开配置弹窗，配置只作用于所选商户；月度汇率独立管理，不能在站点长期配置中直接填写。</p><ul><li>平台 + 游戏类型 + 游戏性质确定一条规则；选择“游戏盈利（GGR）”或“有效投注”，编辑百分比。缺少适用规则的有业务平台不得静默遗漏。</li><li>维护费、月报表低消为周期性费用；本期开版费、本月计划抵扣、其他抵扣为指定账期值，不能无条件复制到后续月份。</li><li>新版本生效账期须晚于该商户最近已下发账期；保存必须填写修改原因。保存配置不直接修改任何已有账单。</li><li>取消或关闭弹窗放弃未保存输入。服务端保存成功后刷新版本及列表；失败则保留输入供重试。</li></ul><h3>MC-02 · 账单管理与查询</h3><p>列表展示账期、编号/版本、地区、厅主名称、站点名称、抽成 BRL、维护费 USDT、低消补差 USDT、合计 USDT/BRL、状态、下发时间与可用操作。总控筛选条件为地区、厅主名称、站点名称、状态和账期；厅主变更时清除不属于该厅主的已选站点；查询结果倒序展示，汇总按当前筛选结果计算。顶部统计卡按当前授权范围统计，原型中不随列表筛选变化。</p><h3>MC-06 · 月度汇率设置（计算前置步骤）</h3><p>入口：总控账单管理的流程提示区，或“查询”右侧的“月度汇率设置”。顶部“开始月结”会先检查所选账期：未确认汇率则进入第 1 步，已确认则进入第 2 步计算。本版按巴西地区 + 账期 + BRL/USDT 币对管理，同一账期全部站点统一使用；站点筛选不缩小汇率生效范围。正式多地区系统使用地区、账期、币对联合唯一键。</p><ul><li>先选择已结束账期，填写本月核定汇率和汇率依据。固定方向为 1 USDT = R BRL，R &gt; 0，最多 4 位小数；空值、非数字、零、负数和超精度禁止确认。</li><li>新账期默认未确认、输入为空，不自动继承上月汇率或站点长期配置值；总控点击“确认本月汇率”后才成为可计算状态。市场取价来源由财务确定，原型不自动取价。</li><li>确认后独立保存汇率版本、依据、确认人和时间，仅完成第 1 步。提示“汇率已保存，尚未计算账单”，可点击“下一步：计算账单”或稍后计算；已有账单金额不会因保存汇率而变化。</li><li>本期尚无下发账单时可以调整汇率，填写修改原因后版本 +1，保留前一版本；本期所有旧汇率版本草稿标记需重新计算且不能下发，其他账期不受影响。相同值无需重复保存。</li><li>本期任一站点账单已下发（含已结清）后，整个月度汇率锁定；其余站点继续使用已确认值计算。已下发更正仍需独立调账流程，不允许覆盖原单。</li><li>历史迁移不自动伪造确认记录。旧草稿先确认月度汇率、重新计算再下发；历史已下发单保留原快照。本期已有历史下发单且汇率一致时，仅允许人工确认同值以便计算剩余站点；历史下发汇率不一致时阻止统一确认，需另行对账。</li><li>站点无汇率设置权限。生产后端必须校验权限及月度版本，使用事务互斥处理“修改汇率”与“下发”并发，锁定状态从该月实际下发账单派生。</li></ul><h3>MC-03 · 计算与重新计算账单</h3><ul><li>选择站点和账期后，展示该月已确认汇率、版本、确认人和时间，汇率只读。未确认时显示明确提示，禁用计算按钮，并提供汇率设置入口。</li><li>计算从月度汇率记录取得 R，以适用站点配置和该月业务统计执行第 7 节 F01–F18。禁止回退使用上月或旧配置中的汇率；金额、版本和数据截止点一起写入账单快照。</li><li>已有待下发账单时，须勾选确认替换；计算成功保持编号，账单版本 +1，保留原完整版本。配置和统计使用本次适用快照，不能仅更改显示金额。</li><li>执行前重新校验账期已结束、月度汇率已确认、汇率版本、配置版本和账单状态；窗口打开后版本变化应重新打开核对。无适用配置、数据未就绪、已下发或已结清禁止计算。</li><li>成功后打开详情核对，状态仍为待下发，不自动下发；关闭计算窗口不产生账单，已独立确认的月度汇率仍保留。保存失败整笔回滚。</li></ul><h3>MC-04 · 下发确认</h3><ul><li>确认弹窗显示账期、商户、账单编号/版本、应付金额、配置版本、汇率；可填写站点可见备注。</li><li>执行前复核最新账单状态、配置适用性、金额完整性及权限；本期汇率未确认或汇率/配置版本过期时，禁止下发并引导先确认汇率及重新计算。</li><li>成功后记录下发人、时间、备注与版本；站点获得只读账单。实际系统须具备幂等控制，连续点击不能生成多份账单。</li></ul><h3>MC-05 · 结清登记与操作记录</h3><p>仅待结清账单可登记。填写实收金额、凭证号，并勾选已核对足额到账；不调用转账接口。成功后锁定本次登记，记录操作者、时间、金额与凭证。操作记录覆盖配置变更、生成/重算、下发与结清，生产日志应保存变更前后值及失败原因。</p></section>
<section id="prd-05" class="prd-section"><div class="prd-sectionhead"><span>05</span><h2>站点后台页面与交互</h2></div><h3>ST-01 · 月结账单列表</h3><p>入口：月结账单 → 月结账单。商户由登录身份锁定，不允许切换其他商户；仅返回已下发账单。原有费用列保留，新增账期与生成日期的明确区分。账期筛选是本原型设计；原页面的生成日期范围筛选如需兼容，应作为独立条件，不与账期混用。</p><p>查询汇总展示维护费、抽成、低消补差及合计；不同币种不可直接相加。无账单时显示“暂无符合条件的账单，总控下发后将在这里显示”，而不是展示草稿或配置值。</p><h3>ST-02 · 账单详情</h3><p>展示账单编号/版本、账期、费用分解、汇率、低消补差、抵扣与余额、下发备注、收款资料及平台抽成明细。全部内容读取下发快照，不根据当前最新配置重新计算。</p><h3>ST-03 · 导出与打印</h3><p>列表导出当前筛选结果；明细导出所选账单全部平台行及金额汇总。原型使用 UTF-8 CSV，打印使用浏览器打印功能。正式导出需与页面币种、金额精度、统计范围一致；对文本单元格做安全转义。</p><p>站点不可编辑比例、费用、汇率、收款信息或自行标记已付款；付款疑问通过商务处理。本期未设计站点确认账单、付款凭证上传或异议工单。</p></section>
<section id="prd-06" class="prd-section"><div class="prd-sectionhead"><span>06</span><h2>字段定义与校验</h2></div><table><thead><tr><th>字段</th><th>单位 / 格式</th><th>定义及开发校验</th></tr></thead><tbody><tr><td>地区 / 厅主名称 / 站点名称</td><td>地区字典 / 厅主归属 / 站点显示名称</td><td>总控分列展示；厅主筛选联动站点，站点名称沿用原商户值。底层仍使用稳定的站点标识关联账单，不能靠显示名称做权限判断</td></tr><tr><td>账期 / 生效账期</td><td>YYYY-MM</td><td>账期按巴西 UTC−03:00 自然月；配置采用从该账期起有效的版本</td></tr><tr><td>统计区间</td><td>左闭右开</td><td>本月 1 日 00:00:00 至次月 1 日 00:00:00（不包含），防止边界重复计算</td></tr><tr><td>平台 / 类型 / 性质</td><td>字典值</td><td>规则匹配维度；同商户同版本维度组合不得重复，禁止前端任意修改字典含义</td></tr><tr><td>结算输赢 / 游戏盈利（GGR） / 公司输赢</td><td>BRL</td><td>公司输赢 = 投注额 − 派彩（含本金），正数公司赢、负数公司输。抽成归零不改变原始输赢；源字段需按公司视角统一。详见 F01–F07</td></tr><tr><td>投注金额 / 有效投注</td><td>BRL</td><td>来自平台月汇总；用于明细展示及有效投注抽成基数，不允许在账单中手工改写统计数据</td></tr><tr><td>抽成方式 / 比例</td><td>枚举 / %</td><td>游戏盈利（GGR）或有效投注；0–100，建议最多 2 位小数；0 表示不计抽成，不代表规则缺失</td></tr><tr><td>维护费 / 月报表低消</td><td>USDT</td><td>非负金额，建议最多 2 位小数；低消为抽成保底额度，不另行整笔叠加</td></tr><tr><td>本期开版费用</td><td>USDT</td><td>本账期新增应收项目；与历史开版费可抵扣余额分开，是否产生抵扣额度按合同确认</td></tr><tr><td>期初剩余可抵扣开版费</td><td>USDT</td><td>抵扣额度余额；正式系统建议从上期已下发账单结转，初始化或调整须留痕</td></tr><tr><td>本月计划抵扣 / 实际抵扣</td><td>USDT</td><td>计划额不得超过期初余额；实际额还受本期应付上限限制，不能产生负应付</td></tr><tr><td>其他抵扣</td><td>USDT</td><td>非负；按开版抵扣之后的剩余应付截断；未使用额度不自动结转，具体政策待确认</td></tr><tr><td>剩余可抵扣开版费用</td><td>USDT</td><td>期初余额减本期实际开版抵扣，为本期结束余额；重算草稿不得重复扣减余额</td></tr><tr><td>汇率</td><td>BRL / USDT</td><td>1 USDT = R BRL，R &gt; 0；建议最多 4 位小数；记录来源、确认时间、操作人和账单版本；按月独立确认后才能计算；本期已有下发账单则锁定</td></tr><tr><td>修改原因 / 下发备注</td><td>文本，最多 200 字符</td><td>修改原因必填且非纯空格；下发备注可选，站点可见；内部原因不直接下发</td></tr><tr><td>实收金额 / 凭证号</td><td>USDT / 文本</td><td>一期仅全额结清，金额等于应付；凭证必填，建议最多 100 字符；零应付结清凭证规则待确认</td></tr><tr><td>收款资料</td><td>币种、网络、地址、联系人</td><td>由总控财务维护并随账单留存快照；真实下发前应完整校验，原型仅展示占位信息</td></tr><tr><td>生成 / 下发 / 结清时间</td><td>时间戳 + 展示时区</td><td>后端统一保存标准时间；展示时区需明确。原型操作日志使用北京时间，账期计算使用巴西时间</td></tr></tbody></table><p class="prd-caption">表中的精度、字数、字典完整性等为开发要求；当前原型已覆盖主要必填、范围、金额/比例精度和状态校验；所有规则仍须由生产后端再次校验。</p></section>
<section id="prd-07" class="prd-section"><div class="prd-sectionhead"><span>07</span><h2>完整计算口径、公式与对账示例</h2></div>
<div class="notice"><b>已明确的产品定义：</b>游戏盈利（GGR）＝公司输赢＝投注额 − 派彩金额（含返还本金）。正数表示公司赢、玩家整体输；负数表示公司输、玩家整体赢。此处“公司输赢”是游戏毛收入，不是扣除运营成本后的公司净利润。</div>
<div class="notice orange">本节列出当前原型全部金额计算、汇总统计、数量及版本计算方式。GGR 的字段定义按本次确认统一；负盈利抽成归零、低消范围、抵扣顺序和跨月余额等结算政策仍是原型采用口径，需按合同定稿。数据源的取消、退款、重结算、优惠投注纳入规则须单独核对，不能只因公式一致就视为取数已确认。</div>
<h3>7.1 · 基础数据与正负方向</h3>
<p>同一站点、同一平台/游戏类型/游戏性质、同一账期及同一币种下，建立一致的结算注单集合 J。以下的投注额与派彩必须来自同一集合；原型暂按账期内已结算业务口径汇总，退款与重结算归属见待确认事项。BRL 金额不得直接与 USDT 金额相加。</p>
<table><thead><tr><th>编号 / 字段</th><th>计算方式</th><th>单位、边界与说明</th></tr></thead><tbody>
<tr><td>F01 投注额 Wᵢ</td><td>Wᵢ = Σ（集合 J 内每笔注单的投注金额）</td><td>BRL。原始投注金额按确认的数据规则统计，不等同于有效投注额。重复回调不能重复计入；取消、退款和重结算应取最终有效版本。</td></tr>
<tr><td>F02 派彩金额 Qᵢ</td><td>Qᵢ = Σ（同一集合 J 内每笔注单的结算返还总金额）</td><td>BRL，包含返还本金。若供应商仅返回“净赢利”，须先按供应商字段定义转换成含本金的返还额；不能对已含本金的派彩再加一次本金。</td></tr>
<tr><td>F03 游戏盈利 / GGR / 公司输赢 Gᵢ</td><td><b>Gᵢ = Wᵢ − Qᵢ</b></td><td>BRL，可正、可零、可负。列表明细中的“结算输赢”采用公司视角，取 Gᵢ。不扣活动、返水、代理佣金、税费或供应商费用。</td></tr>
<tr><td>F04 玩家净输赢（对照口径）</td><td>玩家净输赢 = Qᵢ − Wᵢ = −Gᵢ</td><td>仅作符号核验说明，当前页面不新增该字段。若源系统返回玩家净输赢，先取反得到公司输赢；必须先确认源字段不是“含本金派彩”。</td></tr>
<tr><td>F05 有效投注额 Vᵢ</td><td>Vᵢ = Σ（每笔注单按该平台有效投注规则认定的金额 vⱼ）</td><td>BRL，vⱼ 为供应商或数据中心已确认值。若规则只有全额计入/排除，可写为 Σ（投注金额 × 计入标识 0/1）；存在部分计入、对冲或和局规则时必须使用认定值，不能直接用投注总额或输赢绝对值替代。</td></tr>
<tr><td>F06 按盈利抽成的基数 Bᵢ</td><td>选择游戏盈利（GGR）时：Bᵢ = max(Gᵢ, 0)</td><td>仅抽成基数归零；原始公司输赢 Gᵢ 仍显示负数。原型不跨平台抵亏、不结转亏损。</td></tr>
<tr><td>F07 按有效投注抽成的基数 Bᵢ</td><td>选择有效投注时：Bᵢ = Vᵢ</td><td>Vᵢ 须为非负、完整的有效数据。与公司是否盈利无关；公司亏损时仍可按有效投注计费。原型计算器另有 max(Bᵢ, 0) 防御处理，正式数据校验应拒绝异常负有效投注。</td></tr>
</tbody></table>
<h3>7.2 · 配置输入与费用来源</h3>
<p>以下值是配置输入或账本来源，不通过投注公式推算。生成时按站点和账期取得适用版本并保存快照。除汇率和百分比外，本表金额均为 USDT。</p>
<table><thead><tr><th>字段 / 符号</th><th>取值方式</th><th>使用规则</th></tr></thead><tbody>
<tr><td>抽成比例 Pᵢ</td><td>该平台适用配置中的百分比值</td><td>5.5 表示 5.5%，乘法计算时使用 5.5 ÷ 100；范围 0–100，最多 2 位小数。</td></tr>
<tr><td>汇率 R</td><td>总控已确认的“地区 + 账期 + 币对”月度结算汇率</td><td>1 USDT = R BRL；R &gt; 0，最多 4 位小数。先在“月度汇率设置”中输入并确认，再允许计算账单。计算时自动带入该月值并记录汇率版本、确认时间及操作人；不同月份独立确认，不沿用旧值。市场取价渠道由财务确定，原型不自动取价。</td></tr>
<tr><td>维护费用 M</td><td>本账期适用的每月维护费</td><td>周期性配置项，原型按完整自然月全额计收，不按天折算；如需要首月按天计费须另行定规则。</td></tr>
<tr><td>月报表低消 L</td><td>本账期适用的抽成保底金额</td><td>用于计算抽成补差，不把 L 再整笔追加到已计抽成上；维护费不参与低消比较。</td></tr>
<tr><td>本期开版费用 O</td><td>当前账期对应配置中的新增开版应收</td><td>一次性费用；原型仅在“账期 = 配置生效账期”时取配置值，其他月份取 0。收取 O 不自动增加可抵扣额度 E。</td></tr>
<tr><td>期初可抵扣开版费 E</td><td>当前原型：本账期经人工核对的配置余额</td><td>不等于本期开版应收 O。后续自动结转候选公式：本期期初 E = 上期期末 E′ + 已批准新增额度 − 已批准减少额度；无调整时 E = 上期 E′。此公式为后续设计，当前没有自动结转或额度调整账本。</td></tr>
<tr><td>计划开版抵扣 D</td><td>当前账期配置的计划抵扣额</td><td>D ≤ E；仅配置生效账期使用，后续账期默认 0，需当期重新配置。实际抵扣以 F12 为准。</td></tr>
<tr><td>计划其他抵扣 X</td><td>当前账期配置的其他减免额度</td><td>仅配置生效账期使用，后续账期默认 0；实际抵扣以 F13 为准。未使用部分不自动结转。</td></tr>
</tbody></table>
<h3>7.3 · 账单计算顺序与金额公式</h3>
<p>round₂(x) 表示按四舍五入保留 2 位小数；Σ 表示在相同站点、账期和币种下求和。按 F08 → F17 的顺序计算，不交换低消与抵扣顺序。</p>
<table><thead><tr><th>编号 / 字段</th><th>计算方式</th><th>页面映射与注意事项</th></tr></thead><tbody>
<tr><td>F08 单平台抽成 Cᵢ</td><td>Cᵢ = round₂(max(Bᵢ, 0) × Pᵢ ÷ 100)</td><td>BRL，对应平台明细“抽成金额”。Bᵢ 根据 F06 或 F07 选择；不能将不同抽成方式的基数混算。</td></tr>
<tr><td>F09 抽成账单 C</td><td>C = round₂(Σ Cᵢ)</td><td>BRL，对应列表“抽成账单”。先计算并舍入各平台抽成，再累加；不是先汇总所有平台输赢再乘一个比例。</td></tr>
<tr><td>F10 抽成费用折合 U</td><td>U = round₂(C ÷ R)</td><td>USDT，对应详情“抽成费用折合”。BRL 转 USDT 用除法；不得用有效投注代替 C。</td></tr>
<tr><td>F11 需补交抽成低消 T</td><td>T = round₂(max(L − U, 0))</td><td>USDT。U ≥ L 时 T=0；U &lt; L 时只补差额。若 U=0、L&gt;0，仍按 L 收取抽成保底。</td></tr>
<tr><td>F12前置 抵扣前应付 A</td><td>A = round₂(U + T + M + O)</td><td>USDT，中间计算值。U+T=max(U,L)，不得重复加整笔低消 L。</td></tr>
<tr><td>F12 本月实际抵扣开版费 D′</td><td>D′ = round₂(min(D, E, A))</td><td>USDT，对应列表“本月抵扣开版费”。受计划额、可抵扣余额和本期应付三项上限限制。</td></tr>
<tr><td>F13 实际其他抵扣 X′</td><td>X′ = round₂(min(X, max(A − D′, 0)))</td><td>USDT，对应列表“其他抵扣”。先扣开版抵扣，再扣其他抵扣；不能使应付变负。</td></tr>
<tr><td>F14 合计金额 / 应付总额 F</td><td><b>F = round₂(U + T + M + O − D′ − X′)</b><br>等价于 round₂(A − D′ − X′)</td><td>USDT，账单实际应付。金额可为 0，不得为负。本期未设计将负应付转成应退款。</td></tr>
<tr><td>F15 剩余可抵扣开版费 E′</td><td>E′ = round₂(E − D′)</td><td>USDT，表示本期期末余额，不是期初余额。重算草稿只重新计算，不重复扣减真实额度。</td></tr>
<tr><td>F16 未使用计划抵扣（核对项）</td><td>未使用开版计划 = round₂(D − D′)<br>未使用其他抵扣 = round₂(X − X′)</td><td>USDT，仅供说明当前截断效果，页面未新增字段。“未使用开版计划”不等于余额 E′；其他抵扣未使用部分暂不结转。</td></tr>
<tr><td>F17 BRL 展示合计 Fᴮ</td><td>Fᴮ = round₂(C + (T + M + O − D′ − X′) × R)</td><td>BRL，保留原币抽成 C，再换算其他 USDT 费用；用于与原页面展示对齐。支付结算仍以 USDT 应付 F 为准。</td></tr>
<tr><td>F18 单纯换汇与尾差（核对项）</td><td>USDT 转 BRL = round₂(USDT 金额 × R)<br>BRL 转 USDT = round₂(BRL 金额 ÷ R)<br>展示尾差 Δ = Fᴮ − round₂(F × R)</td><td>由于 U 已经过一次舍入，Fᴮ 不一定等于 round₂(F×R)。尾差可能为正或负，大小取决于汇率与舍入，不应固定假定只能相差 0.01 BRL；不因此修改快照。</td></tr>
</tbody></table>
<h3>7.4 · 列表汇总、统计卡与数量</h3>
<p>定义 B 为当前角色授权范围内的账单集合：总控包含草稿、待结清、已结清；站点仅包含当前站点已下发的待结清、已结清。定义 S 为 B 经地区、厅主、站点/商户、状态、账期筛选后的集合。当前原型顶部统计卡基于 B，不跟随列表筛选；列表汇总与导出基于 S。COUNT 按有效账单编号计数，草稿重算版本不得重复计数。</p>
<table><thead><tr><th>编号 / 字段</th><th>计算方式</th><th>范围与展示</th></tr></thead><tbody>
<tr><td>S01 总控账单总数</td><td>COUNT(B)</td><td>包含全部三种状态，单位“份”。</td></tr>
<tr><td>S02 站点已接收账单</td><td>COUNT(B)，其中站点 B 仅含本商户已下发账单</td><td>待结清数量 + 已结清数量；不含草稿。</td></tr>
<tr><td>S03 总控待下发账单</td><td>COUNT({b∈B | b.status = draft})</td><td>与列表“待下发/草稿”一致；下发成功后从该数量扣除。</td></tr>
<tr><td>S04 站点待结清账单</td><td>COUNT({b∈B | b.status = sent})</td><td>只含已下发、未登记结清的本商户账单。</td></tr>
<tr><td>S05 待结清金额</td><td>round₂(Σ Fᵦ)，仅累加 B 中 status=sent 的账单</td><td>USDT。当前仅支持全额登记，不存在部分收款扣减后的剩余应收。</td></tr>
<tr><td>S06 已结清账单数</td><td>COUNT({b∈B | b.status = paid})</td><td>登记成功增加 1；重复提交不增加。</td></tr>
<tr><td>S07 列表条数 / 展示数量</td><td>COUNT(S)</td><td>当前原型一次展示筛选结果全部行；生产分页时“总条数”仍按 S 计算，不能用本页条数替代。</td></tr>
<tr><td>S08 查询维护费合计</td><td>round₂(Σ Mᵦ)，b∈S</td><td>USDT，读取每份账单快照中的维护费。</td></tr>
<tr><td>S09 查询抽成合计</td><td>round₂(Σ Cᵦ)，b∈S</td><td>BRL，与 USDT 合计分列，不直接相加。</td></tr>
<tr><td>S10 查询低消补差合计</td><td>round₂(Σ Tᵦ)，b∈S</td><td>USDT，累加已计算补差；不能用“总低消 − 总抽成”重新计算各月补差。</td></tr>
<tr><td>S11 查询合计金额</td><td>round₂(Σ Fᵦ)，b∈S</td><td>USDT。按筛选状态包含草稿或已结清账单时，这些金额仍计入查询合计，因此不等于“待结清金额”。</td></tr>
<tr><td>S12 平台规则数 / 明细条数</td><td>配置规则数 = 当前配置的规则行数<br>账单明细条数 = 所选快照的平台明细行数</td><td>相同平台/类型/性质组合不得重复；规则数量不等于有抽成金额的平台数量。</td></tr>
</tbody></table>
<p>若后续增加 BRL 查询合计，应按 round₂(Σ Fᴮᵦ) 累加历史快照，不能先合计 USDT 再使用当前汇率换算。多个账期的汇率可以不同，导出及汇总均禁止改用最新配置重算。</p>
<h3>7.5 · 结清、账期及版本判定</h3>
<table><thead><tr><th>字段 / 规则</th><th>计算或判定方式</th><th>边界</th></tr></thead><tbody>
<tr><td>实收金额 H</td><td>财务人工录入实际到账金额，非系统推算</td><td>USDT，非负，最多 2 位小数；即使应付 F=0，输入为空也不能自动当作 0。</td></tr>
<tr><td>全额结清条件</td><td>到账差额 = H − F；仅当 H − F = 0、凭证有效且已勾选到账确认时允许结清</td><td>还须原状态为待结清。H&lt;F 与 H&gt;F 都拒绝；不做静默抹零、部分结清或超额结清。</td></tr>
<tr><td>账期区间</td><td>开始 = 本月 1 日 00:00:00；结束 = 次月 1 日 00:00:00，取 [开始, 结束)</td><td>巴西 UTC−03:00；12 月的次月为下一年 1 月。账单生成时间与统计账期独立。</td></tr>
<tr><td>允许生成的账期</td><td>所选账期 &lt; 当前巴西年月；“上月账期” = 当前巴西自然月减 1 个月</td><td>不是减 30 天；当前月未结束不能生成正式月结草稿。</td></tr>
<tr><td>适用配置版本</td><td>先筛选生效账期 ≤ 目标账期的版本，取生效账期最大者；若同一生效账期多个版本，取版本号最大者</td><td>未来版本不得影响此前月份重算；无适用版本时阻止生成。</td></tr>
<tr><td>配置版本 / 账单版本</td><td>保存新配置：配置版本 = 当前站点已留存最大版本 + 1<br>首次生成账单：账单版本 = 1<br>重算草稿：账单版本 = 原版本 + 1</td><td>重算仍为同一有效账单编号，不增加统计卡账单数量；已下发账单禁止原地重算。</td></tr>
<tr><td>草稿是否需要重算</td><td>草稿快照配置版本 ≠ 当前账期适用版本，或找不到适用版本 → 需要重算/修复配置</td><td>不是简单比较“最新配置版本”；未来生效的新版本不必使旧账期草稿失效。</td></tr>
</tbody></table>
<h3>7.6 · 舍入顺序与校验要求</h3>
<ol><li>基础投注、派彩和有效投注使用数据源完整精度，先在同口径下完成汇总和 GGR 计算。源金额精度超过 2 位时的标准化规则须由数据与财务确认，不能任意逐笔截断。</li><li>各平台抽成 Cᵢ 先 round₂，然后汇总成 C；C 除汇率得到 U 后再 round₂，再计算低消及各项抵扣；所有列表与导出使用生成时结果。</li><li>金额配置最多 2 位小数；比例最多 2 位；汇率最多 4 位且大于 0。缺失数据不能当作 0：只有已确认无业务才可按 0 计入。</li><li>生产实现采用精确十进制或整数最小货币单位，禁止依赖二进制浮点近似相等判断；结清比较精确到约定金额精度。原型的 JavaScript 计算仅供交互演示。</li><li>显示时补足 2 位小数与千分位不改变原值；不得通过金额格式化覆盖原始投注、派彩或快照数据。</li></ol>
<h3>7.7 · 可复算示例</h3>
<table><thead><tr><th>场景</th><th>输入 / 计算过程</th><th>预期结果</th></tr></thead><tbody>
<tr><td>公司赢 / 玩家输</td><td>投注 100，派彩 80（含本金）</td><td>公司输赢/GGR = 100−80 = <b>+20 BRL</b>；玩家净输赢 = −20 BRL。</td></tr>
<tr><td>公司输 / 玩家赢</td><td>投注 100，派彩 180（含本金）；按 GGR 抽成 5.5%</td><td>公司输赢/GGR = <b>−80 BRL</b>；抽成基数=max(−80,0)=0；抽成=0。明细输赢仍为 −80。</td></tr>
<tr><td>亏损但按有效投注计费</td><td>公司输赢 −80 BRL；有效投注 100 BRL；有效投注抽成 1%</td><td>抽成 = 100×1%=<b>1.00 BRL</b>；不能因为公司亏损改为 0。</td></tr>
<tr><td>PG 的 GGR 与抽成</td><td>投注 11,087,847.25；派彩 10,599,199.93（示例反算值）；比例 5.5%</td><td>GGR = <b>488,647.32 BRL</b>；Cᵢ=round₂(488,647.32×5.5%)=<b>26,875.60 BRL</b>。派彩仅为公式演示，不是现网读取值。</td></tr>
<tr><td>原页面整单复算</td><td>C=44,751.68 BRL，R=5.43，M=3,000，L=5,000，O/D/X=0</td><td>U=8,241.56；T=0；F=<b>11,241.56 USDT</b>；Fᴮ=<b>61,041.68 BRL</b>。</td></tr>
<tr><td>双币展示尾差</td><td>使用上例 F、Fᴮ 和 R</td><td>round₂(11,241.56×5.43)=61,041.67；Δ=61,041.68−61,041.67=<b>0.01 BRL</b>。</td></tr>
<tr><td>抽成未达低消</td><td>C=10,860 BRL，R=5.43；M=3,000；L=5,000；无开版费/抵扣</td><td>U=2,000；T=max(5,000−2,000,0)=3,000；F=<b>8,000 USDT</b>。</td></tr>

<tr><td>查询合计与待结清金额不同</td><td>查询到一份草稿 8,000、一份待结清 5,500、一份已结清 3,000 USDT</td><td>总控账单数=3、待下发数=1、已结清数=1；查询合计=<b>16,500 USDT</b>，待结清金额仅为 <b>5,500 USDT</b>。</td></tr>

<section id="prd-08" class="prd-section"><div class="prd-sectionhead"><span>08</span><h2>数据、快照与一致性要求</h2></div><table><thead><tr><th>对象</th><th>应记录信息</th><th>关键约束</th></tr></thead><tbody><tr><td>商户配置版本</td><td>商户、配置版本、生效账期、平台规则、费用、原因、操作人/时间</td><td>保存历史版本；按账期选择适用版本；不能仅覆盖当前配置</td></tr><tr><td>月度结算汇率</td><td>地区、账期、币对、汇率、版本、依据、确认人/时间</td><td>独立于账单保存；一月一币对一份有效确认记录；首笔下发后锁定；旧版本保留</td></tr><tr><td>账单主记录</td><td>账单编号、商户、账期、账单版本、状态、双币金额及各费用项</td><td>同商户同账期只允许一份有效账单；草稿重算保留重算前完整版本、汇率依据和操作时间，以便追溯</td></tr><tr><td>账单明细快照</td><td>每平台统计值、抽成方式、比例、结果、配置版本、月度汇率值/版本和数据截止点</td><td>下发后禁止读取新配置实时重算；明细汇总必须与主单一致</td></tr><tr><td>下发记录</td><td>接收商户、账单版本、下发人/时间、备注、请求标识、结果</td><td>状态更新与站点可见性一致；重复请求返回原结果</td></tr><tr><td>结清记录</td><td>账单、实收币种/金额、凭证、操作者/时间、请求标识</td><td>只允许待结清转已结清；不能重复登记或再次扣减余额</td></tr><tr><td>操作审计</td><td>操作者、商户范围、操作类型、前后版本/值、原因、结果与时间</td><td>不可由站点修改；失败操作也需记录以便排查</td></tr></tbody></table><p><b>账务一致性：</b>草稿计算不消耗真实抵扣余额；下发时以事务方式确认实际使用额，后续重试不得重复消耗。若正式方案采用“上期下发余额”结转，须限制跨期并发，避免后期账单使用过期余额。</p><p><b>数据就绪：</b>仅统计归属账期内的已结算业务；取消、退款、重结算及迟到数据处理需单独确认。零流水与数据缺失必须区分：确认无业务可按 0 计，数据缺失应阻止生成。</p><p><b>通知边界：</b>本期“下发”至少意味着账单在对应站点可见，不等同于已读或已付款。站内信、邮件等额外通知渠道待确认，不影响账单的唯一性。</p></section>
<section id="prd-09" class="prd-section"><div class="prd-sectionhead"><span>09</span><h2>异常处理与提示文案</h2></div><table><thead><tr><th>异常</th><th>处理要求</th><th>提示示例</th></tr></thead><tbody><tr><td>比例为空 / 越界</td><td>阻止保存，定位对应平台字段</td><td>请填写 0%–100% 范围内的抽成比例</td></tr><tr><td>汇率为 0、负数或无效</td><td>禁止保存、生成及重算</td><td>结算汇率必须大于 0</td></tr><tr><td>计划开版抵扣超余额</td><td>阻止保存</td><td>本月计划抵扣不能超过期初剩余可抵扣开版费</td></tr><tr><td>账期未结束</td><td>禁止生成</td><td>请选择已结束的账期</td></tr><tr><td>没有适用配置 / 规则缺失</td><td>禁止生成并指出缺失项</td><td>该账期无有效配置，请先完成商户结算配置</td></tr><tr><td>重复草稿</td><td>二次确认后方可重算</td><td>该账期已有草稿，请确认重新计算并替换</td></tr><tr><td>配置或月度汇率变更导致草稿过期</td><td>禁止直接下发</td><td>汇率或配置已变更，请重新计算账单后下发</td></tr><tr><td>账单已下发</td><td>禁止覆盖、重复下发及原地改价</td><td>该账单已下发，请刷新查看最新状态</td></tr><tr><td>下发超时 / 结果未知</td><td>先查状态；使用同一请求标识重试</td><td>正在核对下发结果，请勿重复生成账单</td></tr><tr><td>实收与应付不一致</td><td>不允许进入已结清</td><td>当前仅支持足额结清，请核对实收金额</td></tr><tr><td>无权限 / 越权商户</td><td>服务端拒绝，不返回账单敏感内容</td><td>暂无该商户账单的操作权限</td></tr><tr><td>数据未就绪 / 网络失败</td><td>保留操作输入；不产生成功状态</td><td>账单数据尚未就绪，请稍后重试</td></tr></tbody></table></section>
<section id="prd-10" class="prd-section"><div class="prd-sectionhead"><span>10</span><h2>验收标准</h2></div><p>下列为开发验收用例，需在正式数据与真实接口环境复核；不表示 HTML 已通过这些生产级验证。</p><table><thead><tr><th>编号</th><th>前提与操作</th><th>验收结果</th></tr></thead><tbody><tr><td>AC-01</td><td>为商户 762 修改 PG 比例并保存</td><td>仅 762 配置更新，新配置版本递增；763/768 不受影响；原账单快照不变</td></tr><tr><td>AC-02</td><td>比例填 −1/101、汇率填 0、原因留空、抵扣超过余额</td><td>分别出现字段提示，未保存无效配置</td></tr><tr><td>AC-03</td><td>配置生效账期早于或等于已下发账期</td><td>保存被拒绝，历史账单不受影响</td></tr><tr><td>AC-04</td><td>生成当前未结束账期 / 无适用配置账期</td><td>拒绝生成，不产生空账单</td></tr><tr><td>AC-05</td><td>用第 7 节原账单参数生成</td><td>抽成 44,751.68 BRL，应付 11,241.56 USDT，BRL 展示 61,041.68</td></tr><tr><td>AC-06</td><td>分别输入低于低消、负盈利及抵扣超应付的样本</td><td>结果与第 7 节示例一致，无负应付或重复低消</td></tr><tr><td>AC-07</td><td>修改适用配置后直接下发旧草稿</td><td>阻止下发；重算后版本递增，按新配置计算</td></tr><tr><td>AC-08</td><td>“重新计算”时未勾选替换已有草稿</td><td>拒绝替换；确认重算后有效账单不重复</td></tr><tr><td>AC-09</td><td>站点查询草稿及其他商户账单，包括直接接口访问</td><td>不可见、不可越权；服务端返回拒绝或空结果</td></tr><tr><td>AC-10</td><td>总控下发后，站点打开同一账单</td><td>状态待结清，金额、明细、配置版本、汇率、备注与总控一致</td></tr><tr><td>AC-11</td><td>双击下发、超时重试、并发重算与下发</td><td>仅一个有效下发结果，不重复计费或消耗抵扣额</td></tr><tr><td>AC-12</td><td>对已下发账单执行重算或变更配置</td><td>账单不被覆盖；改配置仅影响允许的后续账期</td></tr><tr><td>AC-13</td><td>实收不符 / 凭证为空 / 未确认到账</td><td>禁止结清；足额且校验通过后一次性变为已结清</td></tr><tr><td>AC-14</td><td>结清后切换至站点、查询明细与导出</td><td>两端结清状态一致；只读凭证可追溯；导出金额和行数一致</td></tr><tr><td>AC-15</td><td>账期月末边界、跨年账期、巴西时区边界</td><td>每笔统计只归属一个账期；生成时间与账期不混淆</td></tr><tr><td>AC-16</td><td>筛选无结果、CSV 中文及打印长明细</td><td>空态明确；导出无乱码；打印无截断关键金额与列标题</td></tr><tr><td>AC-17</td><td>本期未确认汇率，直接点击计算或下发旧草稿</td><td>阻止操作并引导月度汇率设置；不得使用站点配置值或上月值兜底</td></tr><tr><td>AC-18</td><td>先确认 2026-10 汇率为 6，再计算原示例站点</td><td>确认汇率时不产生或修改账单；计算后抽成 44,751.68 BRL，折合 7,458.61 USDT，低消补差 0，应付 10,458.61 USDT，BRL 合计 62,751.68，仍待下发</td></tr><tr><td>AC-19</td><td>尚未下发时，月度汇率改为 10 并确认</td><td>旧草稿金额保持原值但禁止下发；重新计算后折合 4,475.17 USDT，低消补差 524.83，应付 8,000.00 USDT；汇率与账单各自递增版本</td></tr><tr><td>AC-20</td><td>本期先后计算多个站点，随后下发其中一份</td><td>各站点使用同一已确认汇率；首份下发后锁定整月汇率，其他站点仍能使用该值计算；下月需独立确认</td></tr><tr><td>AC-21</td><td>输入非法汇率 / 缺依据 / 未确认 / 取消 / 写入失败 / 窗口期间版本变更</td><td>非法输入不保存；取消未保存的输入不生效；已确认汇率不会因退出计算而撤回；失败回滚；版本变更不得静默计算或下发</td></tr><tr><td>AC-22</td><td>历史下发账单迁移且同月汇率一致或不一致</td><td>一致时仅能确认同值；不一致时阻止统一确认并引导对账；原账单金额、状态和快照不重写</td></tr><tr><td>AC-23</td><td>切换至站点后台查看、导出与打印已下发账单</td><td>按下发快照展示汇率与金额，无设置、计算权限，不展示内部汇率依据</td></tr></tbody></table></section>
<section id="prd-11" class="prd-section"><div class="prd-sectionhead"><span>11</span><h2>原型实现边界与演示路径</h2></div><table><thead><tr><th>当前可演示</th><th>正式开发仍需补齐</th></tr></thead><tbody><tr><td>双端切换、编辑比例和费用、必填/范围校验</td><td>真实登录、细分角色、接口权限与商户隔离、生产配置版本持久化</td></tr><tr><td>草稿生成/重算、配置快照、下发及两端可见性</td><td>真实报表、数据封账、服务端并发控制与幂等</td></tr><tr><td>低消、抵扣、汇率与费用计算示例</td><td>财务十进制计算、合同口径、余额自动结转及后端校验</td></tr><tr><td>足额结清、操作记录、CSV 导出及浏览器打印</td><td>真实凭证核验、审计持久化、通知通道、大数据分页和完整导出</td></tr><tr><td>收款信息展示区</td><td>真实收款账户配置、地址校验、变更审计与下发快照</td></tr></tbody></table><div class="prd-callout"><b>建议演示步骤：</b><ol><li>总控后台 → 账单配置 → 编辑商户 762 → 修改 PG 比例、填写原因后保存。</li><li>账单管理 → 月度汇率设置 → 选择 2026-10 → 填写本月核定汇率及依据 → 确认本月汇率。</li><li>点击“下一步：计算账单” → 选择站点 → 查看自动带入的已确认汇率 → 勾选替换已有草稿 → 计算并核对。</li><li>详情 → 下发至站点 → 填写备注 → 确认下发。</li><li>顶部切换站点后台 → 查看 2026-10 账单和抽成明细、导出文件。</li><li>切回总控 → 登记结清 → 录入足额金额和演示凭证 → 再切站点核对状态。</li></ol></div><p>演示数据保存在当前浏览器，不接入生产服务。PG 原页面数据及当期总额用于复算，其他平台和历史数据为补充样本。若此前已下发或结清，可在“规则说明”中重置演示数据后重走流程。</p><p class="prd-caption">V1.9 将月度汇率确认设为计算前置条件，主流程为“确认汇率 → 计算账单 → 核对并下发”；巴西同账期统一汇率，下发后整月锁定。原 V1.8 的账后单据汇率调整入口由月度汇率设置替代，已有账单保留。V1.7 补齐全部现有计算字段的公式、来源、币种、正负方向、舍入及示例，明确游戏盈利（GGR）即公司输赢；不修改当前账单计算结果。V1.5 总控新增厅主名称与站点名称字段并联动筛选、弹窗和导出，站点端维持地区/商户口径；不修改既有账单标识、金额、状态或配置。V1.4 按参考截图调整两端导航，在原菜单底部新增月结账单模块，支持展开/收起。品牌徽标为矢量文字占位，正式接入时替换为原始图片资源。V1.1 补充 PRD；V1.2 新增商户 763 的 2026-10 待下发模拟账单，已有浏览器数据仅补入一次，不覆盖原账单状态。下发后切换站点后台自动查看对应商户，也可通过顶部“演示商户”切换；此入口仅用于原型评审，正式站点身份仍由登录权限锁定。</p></section>
<section id="prd-12" class="prd-section"><div class="prd-sectionhead"><span>12</span><h2>流程自检结论与优化清单 · V1.3</h2></div><div class="notice orange"><b>结论：正常月结演示主线闭环，完整账务生命周期尚未闭环。</b>配置 → 生成/重算 → 核对 → 下发 → 对应站点查看 → 足额结清可演示。跨月抵扣自动结转、已下发账单更正、异常收款仍需业务定稿及开发补齐；不能据此认定已具备生产上线条件。</div><table><thead><tr><th>环节</th><th>当前结论</th><th>检查发现与处理</th></tr></thead><tbody><tr><td>配置 → 生成</td><td>原型已修复</td><td>原先只保留最新配置，提前配置下个月会导致旧账期不能重算。现留存版本，按生效账期及版本选择；总控配置列表可查看版本记录。</td></tr><tr><td>生成 → 核对</td><td>原型可演示</td><td>新生成/重算记录实际时间，账期单独保存；已结束账期按巴西时间判断；草稿显示“汇率/配置待核对 · 需重新计算”。</td></tr><tr><td>核对 → 下发</td><td>原型可演示</td><td>仅适用版本一致的草稿允许下发；下发后锁定快照；重复操作受状态限制。真实并发与幂等须在后端实现。</td></tr><tr><td>下发 → 站点接收</td><td>原型可演示</td><td>对应商户可见；其他商户与草稿不可通过正常站点入口查看/导出；切换后台关闭原弹窗。当前只是本机模拟，无真实权限系统与通知服务。</td></tr><tr><td>足额收款 → 结清</td><td>原型可演示</td><td>实收必须明确填写且精确等于应付；金额最多 2 位小数，不能把空输入当作 0；凭证与到账确认必填。</td></tr><tr><td>本期 → 下期</td><td>部分闭环</td><td>未实现抵扣余额自动结转。有跨月额度时阻止直接沿用旧配置，须为本期人工核对期初余额、保存带原因的新配置；仍不等于正式结转账本。</td></tr><tr><td>已下发错误 → 更正</td><td>未闭环</td><td>锁定账单能避免随意改价，但尚无差额调整或冲销重开入口。不能通过删除/覆盖原单解决。</td></tr><tr><td>少付 / 多付 / 退款 / 零应付</td><td>未闭环</td><td>当前仅足额手工登记；零应付仍走同样登记，凭证要求与自动结清政策待财务确认。</td></tr><tr><td>查询 → 对账导出</td><td>原型已修复</td><td>明细 CSV 补齐开版费、低消、计划/实际抵扣、期初/期末余额、双币总额、版本与状态时间，防止导出后无法复算。</td></tr><tr><td>保存失败 → 重试</td><td>单窗口原型已修复</td><td>配置保存、生成、下发、结清在本地写入失败时恢复原状态并提示。多标签并发覆盖、跨设备同步与后端事务尚未实现。</td></tr></tbody></table><h3>已完成的明确修复</h3><ul><li>历史配置保留并按账期匹配；升级前已经被覆盖且没有账单快照的配置，无法凭空恢复。</li><li>生成时间不再写死；月份跨年计算正确；历史预置账单保留其演示日期，旧浏览器数据不被重写。</li><li>费用和比例限制为 2 位小数，汇率限制为 4 位小数；修改原因、下发备注及凭证校验长度。</li><li>切换角色关闭弹窗，站点入口禁止配置保存、生成及跨商户明细导出；生产服务端权限仍是上线前提。</li><li>导出补齐对账字段，并对可能被表格软件当作公式的文本做转义；按有效投注计费的说明不再误写为负盈利归零计费。</li><li>移除未实现分页时的“每页 20 条”表述；改为显示实际展示条数，正式大数据分页仍待实现。</li></ul><h3>建议优先补齐的业务闭环</h3><table><thead><tr><th>优先级</th><th>需补齐的方案</th><th>建议流程 / 验收出口</th><th>确认方</th></tr></thead><tbody><tr><td>P0</td><td>跨月抵扣账本</td><td>期初额度来源 → 本月计划/实际抵扣 → 下发时确认消耗 → 期末余额 → 下期继承；重试不重复扣减，跳月与跨期并发有明确顺序。</td><td>财务 / 产品 / 研发</td></tr><tr><td>P0</td><td>账单更正与迟到数据</td><td>发起更正并说明原因 → 关联原单 → 财务审核 → 差额调整或冲销重开 → 站点展示更正关系 → 应收与实收同步更新。正负差额、已结清单如何处理须先定稿。</td><td>财务 / 数据 / 产品</td></tr><tr><td>P0</td><td>真实数据、收款资料与下发一致性</td><td>数据封账及完整性校验 → 真实收款账户版本 → 下发状态与站点可见性一致 → 超时查结果 → 幂等重试。补充核对人与下发人是否分离的审批决策。</td><td>财务 / 研发 / 测试</td></tr><tr><td>P1</td><td>收款明细与特殊结清</td><td>若支持部分付款：逐笔登记实收 → 累计实收 → 剩余应收 → 足额结清；另定超额款、退款、撤销登记及零应付结清规则。</td><td>财务 / 商务</td></tr><tr><td>P1</td><td>站点对账反馈</td><td>站点是否需要“确认账单 / 提出异议 / 上传付款凭证”；如继续线下处理，应记录处理人、结论、时间，并区分已下发、已读、已确认、已付款。</td><td>商务 / 运营 / 产品</td></tr><tr><td>P1</td><td>通知、期限与催收</td><td>明确应付截止日、通知渠道、通知失败重试及催收记录；是否停服必须另立规则，不由结清状态隐式触发。</td><td>商务 / 运营</td></tr></tbody></table><h3>V1.9 月度汇率前置流程自检</h3><p>通过 66 项模拟环境逻辑断言，覆盖未确认禁止计算、确认不产生账单、同月跨站点复用、跨月独立确认、汇率变更使草稿过期、下发后整月锁定、历史账单兼容、正常下发结清、权限隔离与写入失败回滚。本轮未执行真实浏览器视觉或生产接口测试。</p><h3>V1.3 自检范围与证据（历史记录）</h3><p>本次通过 42 项针对性逻辑断言，覆盖原缺陷复现、配置版本匹配、月份边界、输入精度、角色切换、导出范围、正常下发结清、本地写入失败回退及刷新后状态保持。原有主流程与模拟账单迁移另做回归检查。</p><p class="prd-caption">检查方式为源码审查和模拟环境逻辑执行；本轮未进行真实浏览器视觉、下载/打印、多标签并发、真实接口、真实收款或生产权限测试。测试通过不等同于金融精度或正式上线验收完成。</p></section>

<script>
const KEY='panda-billing-prototype-v1';const $=id=>document.getElementById(id);const money=n=>Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});const round=n=>Math.round((n+Number.EPSILON)*100)/100;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const copy=o=>JSON.parse(JSON.stringify(o));const now=()=>new Date().toLocaleString('sv-SE',{timeZone:'Asia/Shanghai'})+' 北京时间';
const seedRows=[{name:'PG',type:'电子',nature:'自研',base:'游戏盈利',rate:5.5,profit:488647.32,bet:11087847.25,valid:11087847.25},{name:'PP',type:'电子',nature:'第三方',base:'游戏盈利',rate:5,profit:180000,bet:4250000,valid:4200000},{name:'Evolution',type:'视讯',nature:'第三方',base:'游戏盈利',rate:10,profit:88760.8,bet:2318000,valid:2318000},{name:'自研体育',type:'体育',nature:'自研',base:'游戏盈利',rate:8,profit:-12500,bet:1280000,valid:1210000}];
function baseConfig(site='762'){return {site,version:1,effective:'2026-10',maintenance:3000,minimum:5000,opening:0,creditBalance:0,monthlyCredit:0,other:0,fx:5.43,rows:copy(seedRows),reason:'初始化演示配置',updated:'2026-10-01 00:00:00',payAccount:'演示收款账户 · USDT / TRC20',contact:'商务联系人（演示）'}}
function calculate(c){const lines=c.rows.map(r=>({...r,amount:round(Math.max(0,r.base==='游戏盈利'?r.profit:r.valid)*r.rate/100)}));const commission=round(lines.reduce((s,r)=>s+r.amount,0));const converted=round(commission/c.fx);const topup=round(Math.max(0,c.minimum-converted));const before=round(converted+topup+c.maintenance+c.opening);const openingCredit=round(Math.min(c.monthlyCredit,c.creditBalance,before));const otherCredit=round(Math.min(c.other,Math.max(0,before-openingCredit)));return {lines,commission,converted,topup,openingCredit,otherCredit,remaining:round(c.creditBalance-openingCredit),total:round(before-openingCredit-otherCredit),brl:round(commission+(topup+c.maintenance+c.opening-openingCredit-otherCredit)*c.fx)}}

function saveConfig(){if(role!=='master')return;let old=state.configs[activeConfig],c=copy(old),fields=['maintenance','minimum','opening','creditBalance','monthlyCredit','other'];for(let f of fields){if(!numeric($(f).value,f==='fx'?4:2))return err(f==='fx'?'汇率须为有效非负数字，最多 4 位小数。':'费用须为有效非负金额，最多 2 位小数。');c[f]=Number($(f).value)}if(c.monthlyCredit>c.creditBalance)return err('本月计划抵扣不能超过期初剩余可抵扣开版费。');for(let i=0;i<c.rows.length;i++){let v=$('rate'+i).value,base=$('base'+i).value;if(!numeric(v,2)||Number(v)>100)return err('抽成比例须在 0%–100% 之间，最多 2 位小数。');if(!['游戏盈利','有效投注'].includes(base))return err('请选择有效的抽成方式。');c.rows[i].rate=Number(v);c.rows[i].base=base}c.effective=$('effective').value;if(!validMonth(c.effective))return err('请选择有效的生效账期。');let last=state.bills.filter(b=>b.site===c.site&&b.status!=='draft').map(b=>b.month).sort().pop();if(last&&c.effective<=last)return err(`站点已下发至 ${last}，新配置须从后续账期生效。`);c.reason=$('configReason').value.trim();if(!c.reason||c.reason.length>200)return err('修改原因须为 1–200 个字符。');ensureConfigHistory();c.version=Math.max(...state.configVersions[c.site].map(v=>v.version))+1;c.updated=now();if(!commitChange(()=>{state.configs[activeConfig]=c;state.configVersions[c.site].push(copy(c))},{site:c.site,action:'修改账单配置',detail:`V${old.version} → V${c.version}，生效 ${c.effective}；${c.reason}`}))return;closeModal();render();toast('新版本已保存，历史配置保留；适用草稿需重新生成')}
function generateModal(site,month){if(role!=='master')return;site=site||(state.configs[$('fsite')?.value]?$('fsite').value:['762','763','768'].find(id=>!$('fowner')?.value||$('fowner').value==='all'||siteMeta(id).ownerId===$('fowner').value)||'762');month=month||$('fmonth')?.value||previousMonth(brazilMonth());generationContext=null;modal('计算月结账单',`${flowSteps(monthlyRate(month)?2:1)}<div class="notice">先确认月度汇率，再计算所选站点的账单。本步骤自动读取已确认汇率，计算完成后仍需核对并下发。</div><div class="formgrid"><div class="field"><label>站点名称 *</label><select id="genSite" onchange="updateGeneratedOwner()">${masterSiteOptions(site,false)}</select></div>${inputField('账期（巴西 UTC−03:00） *','genMonth',month,'month','onchange="updateGeneratedOwner()"')}<div class="field"><label>厅主名称</label><input id="genOwner" disabled></div></div><div id="genRateStatus"></div><div class="summarybox small" style="line-height:2;margin-top:16px">数据来源：演示用平台月结汇总<br>比例与费用：所选站点本账期的适用配置<br>本次操作：计算并保存一份待下发账单，不自动下发</div><label class="rowflex small" style="margin-top:20px"><input type="checkbox" id="replaceDraft">若已有待下发账单，确认重新计算并替换（保留历史版本）</label>`,`<button onclick="closeModal()">取消</button><button onclick="monthlyRateModal($('genMonth').value,$('genSite').value)">设置 / 查看本期汇率</button><button id="calculateBillBtn" class="primary" disabled onclick="generate()">计算账单</button>`,'wide');updateGeneratedOwner()}
function generate(){if(role!=='master')return;const site=$('genSite').value,m=$('genMonth').value;if(!state.configs[site])return err('请选择有效站点。');if(!validMonth(m)||m>=brazilMonth())return err('请选择巴西时间已结束的账期。');const r=monthlyRate(m);if(!r)return err('本期汇率尚未确认，请先设置月度汇率。');const existing=state.bills.find(b=>b.site===site&&b.month===m),c=configFor(site,m);if(existing&&existing.status!=='draft')return err('该账期已下发，不能覆盖或重复计算。');if(!c)return err('所选账期没有适用配置，请先完成配置。');const ctx=generationContext;if(!ctx||ctx.site!==site||ctx.month!==m||ctx.rateVersion!==r.version||ctx.configVersion!==c.version||ctx.billStamp!==(existing?JSON.stringify(existing):null))return err('汇率、配置或账单已变化，请重新打开计算窗口核对。');if(existing&&!$('replaceDraft').checked)return err('已有待下发账单，请勾选确认替换。');const previous=state.bills.filter(b=>b.site===site&&b.month<m&&b.status!=='draft').sort((a,b)=>b.month.localeCompare(a.month))[0];if(m!==c.effective&&(c.creditBalance>0||(previous&&previous.values.remaining>0)))return err('跨月抵扣余额尚未自动结转，请为本期保存配置并核对期初余额。');const effective=copy(c);effective.fx=r.fx;if(m!==c.effective){effective.opening=0;effective.monthlyCredit=0;effective.other=0}const b=bill(effective,m);b.configSnapshot=copy(c);b.monthlyRateVersion=r.version;b.fxMeta={source:'月度结算汇率',time:r.time,actor:r.actor,version:r.version};b.revisions=existing?[...(existing.revisions||[]),billRevision(existing,'重新计算')]:[];if(existing)b.version=existing.version+1;if(!Number.isFinite(b.values.total)||b.values.total<0)return err('账单计算异常，请检查配置。');if(!commitChange(()=>{if(existing)state.bills=state.bills.filter(x=>x.id!==existing.id);state.bills.push(b)},{site,action:existing?'重新计算账单':'计算月结账单',detail:`${m} · 账单 V${b.version} · 配置 V${c.version} · 汇率 V${r.version} / ${r.fx} BRL/USDT · ${money(b.values.total)} USDT`}))return;closeModal();filter={site:'all',status:'all',month:m};page='bills';render();detail(b.id);toast('账单计算完成，请核对后下发') }
function getBill(id){return state.bills.find(b=>b.id===id)}function detail(id){let b=getBill(id);if(!canView(b))return;let c=b.snapshot,v=b.values;modal(`账单详情 · ${b.month} / ${role==='master'?'站点名称':'商户'} ${b.site}`,`${role==='master'?identityFields(b.site):''}<div class="timeline"><div class="${b.status==='draft'&&!monthlyRate(b.month)?'':'done'}"><b>01 确认汇率</b>${b.status==='draft'&&!monthlyRate(b.month)?'待确认本期汇率':(b.fxMeta?.version?'汇率 V'+b.fxMeta.version:'历史账单快照')+' · '+b.snapshot.fx}</div><div class="done"><b>02 计算账单</b>${b.generated} · V${b.version}</div><div class="${b.status!=='draft'?'done':''}"><b>03 下发至站点</b>${b.sent?esc(b.sent):'等待总控核对下发'}</div><div class="${b.status==='paid'?'done':''}"><b>04 登记结清</b>${b.settled?esc(b.settled):'等待到账确认'}</div></div>${b.note?`<div class="notice">下发备注：${esc(b.note)}</div>`:''}<div class="split"><div class="summarybox"><div class="rowflex" style="justify-content:space-between"><span class="muted small">账单应付总额</span>${status(b)}</div><div class="amount num" style="margin-top:10px">${money(v.total)} <small>USDT</small></div><div class="small muted num" style="margin-top:5px">≈ ${money(v.brl)} BRL　｜　1 USDT = ${c.fx} BRL</div><div class="dlist"><div><span>账单编号</span><b>${b.id}</b></div><div><span>配置版本</span><b>V${c.version}</b></div><div><span>汇率来源</span><b>${esc(b.fxMeta?.source||'配置快照')}</b></div><div><span>汇率确认时间</span><b>${esc(b.fxMeta?.time||b.created)}</b></div><div><span>维护费用</span><b>${money(c.maintenance)}</b></div><div><span>开版费用</span><b>${money(c.opening)}</b></div><div><span>抽成费用折合</span><b>${money(v.converted)}</b></div><div><span>月报表低消</span><b>${money(c.minimum)}</b></div><div><span>需补交低消</span><b>${money(v.topup)}</b></div><div><span>本月抵扣开版费</span><b>−${money(v.openingCredit)}</b></div><div><span>其他抵扣</span><b>−${money(v.otherCredit)}</b></div><div><span>剩余可抵扣开版费</span><b>${money(v.remaining)}</b></div></div><div class="calc">合计 = 抽成折合 + 低消补差 + 维护费 + 开版费 − 本月开版抵扣 − 其他抵扣<br>低消补差 = max（月报表低消 − 抽成折合，0）<br><span class="muted">费用单位：USDT；BRL 合计保留原币精度，双币换算可能存在舍入尾差，按已保存结果展示。</span></div></div><div class="accountbox"><h3>数字货币收款资料</h3><p>结算币种　<b>USDT</b><br>协议类型　<b>TRC20</b></p><div class="notice orange">此处为收款信息展示占位，不含可用收款地址。<br>实际开发时由总控财务配置，随账单保存快照。</div><p>商务联系人：${esc(c.contact)}<br>账期：${b.month}-01 至 ${b.month}-${new Date(Number(b.month.slice(0,4)),Number(b.month.slice(5)),0).getDate()}<br>统计时区：巴西 UTC−03:00</p><p>温馨提示：付款前请联系商务二次核对收款信息；到账后由总控登记结清。</p>${b.status==='paid'?`<div class="notice">结清凭证：${esc(b.reference)}<br>已登记金额：${money(v.total)} USDT</div>`:''}</div></div><div class="rowflex" style="justify-content:space-between;margin-bottom:14px"><h3>平台抽成明细 <span class="badge">${v.lines.length} 条</span></h3><div class="actions no-print"><button onclick="exportDetail('${b.id}')">↓ 导出抽成账单</button><button onclick="window.print()">打印</button></div></div><div class="tablewrap"><table><thead><tr><th>平台</th><th>游戏类型</th><th>游戏性质</th><th>结算输赢 (BRL)</th><th>投注金额 (BRL)</th><th>有效投注 (BRL)</th><th>抽成方式</th><th>抽成比例</th><th>抽成金额 (BRL)</th></tr></thead><tbody>${v.lines.map(r=>`<tr><td class="strong">${r.name}</td><td>${r.type}</td><td>${r.nature}</td><td class="num" style="color:${r.profit<0?'#d45d5d':'#278a5b'}">${money(r.profit)}</td><td class="num">${money(r.bet)}</td><td class="num">${money(r.valid)}</td><td>${chargeBaseLabel(r.base)}</td><td>${r.rate}%</td><td class="num strong">${money(r.amount)}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="8" class="right strong">抽成账单合计</td><td class="strong num">${money(v.commission)}</td></tr></tfoot></table></div><div class="footnote">按盈利计费：负盈利基数归零；按有效投注计费：使用有效投注基数，不受盈利正负影响。明细与费用均为账单生成时的快照。</div>`,`<button onclick="closeModal()">关闭</button>${role==='master'&&b.status==='draft'?`<button onclick="generateModal('${b.site}','${b.month}')">重新计算</button><button class="primary" onclick="dispatchModal('${b.id}')">下发至站点</button>`:role==='master'&&b.status==='sent'?`<button class="primary" onclick="settleModal('${b.id}')">登记结清</button>`:''}`,'wide')}
function dispatchModal(id){if(role!=='master')return;let b=getBill(id);if(!b||b.status!=='draft')return toast('该账单已下发');let cfg=configFor(b.site,b.month);modal('下发账单确认',`<div class="notice">下发后，站点 ${siteMeta(b.site).siteName} 可在站点后台查看此账单。账单金额、比例和汇率将锁定。</div><div class="summarybox"><div class="small muted">${b.month} · ${b.id} · V${b.version}</div><div class="amount num" style="margin:12px 0">${money(b.values.total)} <small>USDT</small></div><div class="small">地区：${siteMeta(b.site).region}<br><br>厅主名称：${siteMeta(b.site).ownerName}<br><br>站点名称：${siteMeta(b.site).siteName}<br><br>配置版本：V${b.snapshot.version}　　结算汇率：${b.snapshot.fx}</div></div>${draftStale(b)?'<div class="notice orange" style="margin-top:15px">请先确认本期汇率，并按最新汇率及配置重新计算账单。</div>':''}<div class="field" style="margin-top:20px"><label>下发备注（站点可见）</label><textarea id="sendNote" maxlength="200" placeholder="例如：请核对本期账单，如有疑问请联系商务"></textarea></div>`,`<button onclick="detail('${id}')">返回详情</button><button class="primary" ${draftStale(b)?'disabled':''} onclick="dispatch('${id}')">确认下发</button>`,'narrow')}
function dispatch(id){if(role!=='master')return;let b=getBill(id);if(!b||b.status!=='draft')return;if(draftStale(b))return err('本期汇率未确认或账单计算版本已过期，请确认汇率并重新计算后下发。');const note=$('sendNote').value.trim();if(note.length>200)return err('下发备注最多 200 个字符。');if(!commitChange(()=>{b.status='sent';b.sent=now();b.note=note},{site:b.site,action:'下发账单',detail:`${b.month} · V${b.version} · ${money(b.values.total)} USDT`}))return;previewSite=b.site;closeModal();render();toast('账单已下发，可切换“站点后台”查看')}
function settleModal(id){if(role!=='master')return;let b=getBill(id);if(!b||b.status!=='sent')return;modal('登记账单结清',`<div class="notice orange">本操作仅模拟财务登记，不发起转账。确认足额到账后，站点账单状态将同步为“已结清”。</div><div class="summarybox"><div class="small muted">${siteMeta(b.site).ownerName} / 站点 ${siteMeta(b.site).siteName} · ${b.month}</div><div class="amount num" style="margin-top:8px">${money(b.values.total)} <small>USDT</small></div></div><div class="formgrid" style="grid-template-columns:1fr">${inputField('实收金额（USDT）','received',b.values.total)}${inputField('收款凭证号 / 交易单号 *','receipt','','text','placeholder="填写演示凭证号" maxlength="100"')}</div><label class="rowflex small"><input id="paidCheck" type="checkbox">已核对足额到账，确认登记结清</label>`,`<button onclick="closeModal()">取消</button><button class="primary" onclick="settle('${id}')">确认结清</button>`,'narrow')}
function settle(id){if(role!=='master')return;let b=getBill(id);if(!b||b.status!=='sent')return;const received=$('received').value.trim(),receipt=$('receipt').value.trim();if(!numeric(received,2))return err('请填写实收金额，最多 2 位小数；零金额也须明确填写 0。');if(Number(received)!==b.values.total)return err('本原型仅支持足额结清，实收金额须等于账单应付金额。');if(!receipt||receipt.length>100)return err('收款凭证须为 1–100 个字符。');if(!$('paidCheck').checked)return err('请勾选到账确认。');if(!commitChange(()=>{b.status='paid';b.settled=now();b.reference=receipt;b.received=Number(received)},{site:b.site,action:'登记结清',detail:`${b.month} · ${money(b.values.total)} USDT · 凭证 ${receipt}`}))return;closeModal();render();toast('已登记结清，站点状态已同步')}

function renderRules(){$('content').innerHTML=header('规则说明','原型设计依据、两端权限与待确认的结算口径。',`<button class="danger" onclick="resetDemoModal()">重置演示数据</button>`)+`<div class="notice orange">这是根据现有站点页面推导的产品原型，不连接真实后台，也不会实际下发账单或收付款。预置账单使用 2026 年示例数据，新生成账单按当前巴西时间校验账期。</div><div class="helpgrid"><div class="helpblock"><h3>01 · 已从现有页面确认</h3><p>账单列表包含开版费、剩余可抵扣开版费、本月抵扣、其他抵扣、维护费、抽成账单、低消补差、月报表低消与双币合计。</p><p>账单明细按平台、游戏类型、游戏性质、结算输赢、投注金额、有效投注、抽成方式及比例展示。</p><p>11 月 1 日生成的是 10 月账期。示例汇率 5.43，维护费 3,000 USDT，低消 5,000 USDT，PG 按盈利 5.5% 抽成。</p></div><div class="helpblock"><h3>02 · 总控与站点职责</h3><p><b>总控：</b>按商户编辑比例和费用 → 确认月度汇率 → 计算账单 → 核对 → 下发站点 → 到账后登记结清。</p><p><b>站点：</b>仅查看本商户已下发账单、查看费用和抽成明细、导出及打印。不可编辑比例或修改金额。</p><p>页面顶部可切换两端，状态即时联动。生产系统须在服务端实施权限隔离。</p></div><div class="helpblock"><h3>03 · 原型采用的计算口径（待业务确认）</h3><p>单平台抽成 = max（计费基数，0）× 抽成比例。基数可选游戏盈利（GGR/公司输赢）或有效投注；游戏盈利 = 投注额 − 派彩（含本金）。仅按盈利抽成时负盈利基数归零，不跨平台抵亏、不结转亏损。</p><p>抽成 USDT = 平台抽成 BRL 合计 ÷ 结算汇率。低消补差 = max（低消 − 抽成 USDT，0），维护费不计入低消。</p><p>应付 = 抽成 + 低消补差 + 维护费 + 开版费 − 开版抵扣 − 其他抵扣。抵扣不得造成负应付，剩余开版抵扣额随账单展示。</p><p>每平台先保留 2 位，再汇总换汇并四舍五入。开版费和本月抵扣为单期配置，跨月抵扣余额自动结转尚待接入；有余额时须为当期新建配置并人工核对，避免沿用过期余额。</p></div><div class="helpblock"><h3>04 · 数据与边界</h3><p>保留原页面的 PG 示例与本期合计 44,751.68 BRL / 11,241.56 USDT；其余平台、历史账单与商户均为补充演示数据。</p><p>比例保存留痕，草稿重算版本递增；已下发账单保持快照，不可直接覆盖。正式更正须设计冲销或调账单。</p><p>原型数据保存在当前浏览器；两个入口模拟角色切换，不代表真实登录权限。收款地址为占位，不可用于付款。</p><p>待确认：盈利正负口径、负盈利抵扣、低消与抵扣顺序、汇率来源、自动出账时间、收款配置及真实通知通道。</p></div></div>`}
function resetDemoModal(){modal('重置演示数据',`<p>将清除当前浏览器中的比例调整、下发状态与操作记录，并恢复初始演示数据。</p><p class="muted small">不会影响任何真实后台或其他浏览器。</p>`,`<button onclick="closeModal()">取消</button><button class="primary" onclick="state=initial();persist();closeModal();page='bills';render();toast('演示数据已重置')">确认重置</button>`,'narrow')}

function brazilMonth(){return new Date(Date.now()-3*3600000).toISOString().slice(0,7)}
function nextMonth(m){const [y,n]=m.split('-').map(Number);return new Date(Date.UTC(y,n,1)).toISOString().slice(0,7)}
function previousMonth(m){const [y,n]=m.split('-').map(Number);return new Date(Date.UTC(y,n-2,1)).toISOString().slice(0,7)}
function validMonth(m){return /^\d{4}-(0[1-9]|1[0-2])$/.test(m)}
function numeric(value,places=2){const t=String(value??'').trim();return new RegExp('^\\d{1,12}(?:\\.\\d{1,'+places+'})?$').test(t)&&Number.isFinite(Number(t))}
function ensureConfigHistory(){state.configVersions??={};for(const site of Object.keys(state.configs)){const versions=new Map((state.configVersions[site]||[]).map(c=>[c.version,c]));for(const b of state.bills.filter(b=>b.site===site)){if(!versions.has(b.snapshot.version))versions.set(b.snapshot.version,copy(b.configSnapshot||b.snapshot))}const c=state.configs[site];versions.set(c.version,copy(c));state.configVersions[site]=[...versions.values()];}}
function configFor(site,month){ensureConfigHistory();return (state.configVersions[site]||[]).filter(c=>c.effective<=month).sort((a,b)=>b.effective.localeCompare(a.effective)||b.version-a.version)[0]||null}
function draftStale(b){const c=configFor(b.site,b.month),r=monthlyRate(b.month);return !c||c.version!==b.snapshot.version||!r||b.monthlyRateVersion!==r.version||b.snapshot.fx!==r.fx}

function refreshMonthlyRate(){if(role!=='master'||!rateContext)return;const m=$('monthlyMonth').value,r=monthlyRate(m),issued=state.bills.filter(b=>b.month===m&&b.status!=='draft'),rates=[...new Set(issued.map(b=>b.snapshot.fx))],locked=!!issued.length;rateContext.month=m;rateContext.before=JSON.stringify(r);$('monthlyFx').value=r?r.fx:rates.length===1?rates[0]:'';$('monthlyFx').disabled=locked;$('monthlyReason').value='';$('monthlyReason').disabled=locked&&!!r;$('monthlyNext').disabled=!r||!validMonth(m)||m>=brazilMonth();$('confirmMonthlyRate').disabled=!!(r&&locked)||rates.length>1||!validMonth(m)||m>=brazilMonth();$('monthlyRateInfo').innerHTML=`<div class="notice ${r?'':'orange'}">${r?`本期已确认：<b>1 USDT = ${r.fx} BRL</b> · V${r.version}<br>${esc(r.actor)} · ${esc(r.time)}<br>汇率依据：${esc(r.reason)}`:'本期尚未确认；确认前不能计算新账单。'}${locked?'<p>该账期已有下发账单，汇率不可修改。</p>':''}${!r&&rates.length===1?'<p>历史账单使用上方汇率；请核对依据并确认同值后，继续计算本期其他站点账单。</p>':''}${rates.length>1?'<p class="danger">历史已下发账单存在不同汇率，不能自动统一。请选择新账期；历史差异须另行对账处理。</p>':''}${r&&!locked?'<p>如需调整，请填写新汇率与原因。本期所有待下发账单须按新版本重新计算。</p>':''}</div>`;$('error').style.display='none'}
function confirmMonthlyRate(){if(role!=='master'||!rateContext)return;const m=$('monthlyMonth').value,raw=$('monthlyFx').value,reason=$('monthlyReason').value.trim(),old=monthlyRate(m);if(!validMonth(m)||m>=brazilMonth())return err('请选择巴西时间已结束的结算账期。');if(rateContext.month!==m||rateContext.before!==JSON.stringify(old))return err('账期或汇率已变化，请重新打开窗口核对。');if(!numeric(raw,4)||Number(raw)<=0)return err('汇率必须大于 0，最多 4 位小数。');const fx=Number(raw),issued=state.bills.filter(b=>b.month===m&&b.status!=='draft');if(old&&issued.length)return err('本期已有下发账单，汇率已锁定。');if(issued.some(b=>b.snapshot.fx!==fx))return err('本期已有下发账单，只能确认与其快照相同的汇率。');if(old&&old.fx===fx)return err('本期已确认该汇率，可直接进入下一步计算账单。');if(!reason||reason.length>200)return err('请填写 1–200 字符的汇率依据 / 修改原因。');const r={month:m,region:'巴西',pair:'BRL/USDT',fx,version:(old?.version||0)+1,time:now(),actor:'总控管理员',reason};const site=rateContext.site;if(!commitChange(()=>{state.monthlyRates??={};state.monthlyRateHistory??=[];if(old)state.monthlyRateHistory.push(copy(old));state.monthlyRates[m]=r;},{site:'全部站点',action:'确认月度结算汇率',detail:`巴西 · ${m} · 汇率 V${r.version} · ${old?old.fx+' → ':''}${fx} BRL/USDT · ${reason}`}))return;closeModal();filter.month=m;page='bills';render();modal('本月汇率已确认',`${flowSteps(1)}<div class="summarybox"><div class="small muted">${m} · 巴西全部站点 · 汇率 V${r.version}</div><div class="amount" style="margin:16px 0">1 USDT = ${fx} BRL</div><p>汇率已保存，尚未计算账单。</p><p class="small muted">下一步选择站点计算账单，核对结果后再下发。${old?'本期已有草稿须按新汇率版本重新计算。':''}</p></div>`,`<button onclick="closeModal()">稍后计算</button><button class="primary" onclick="generateModal('${site}','${m}')">下一步：计算账单</button>`,'wide')}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render();
</script></body></html>
