<div class="prd-meta"><span>文档版本 <b>V2.2</b></span><span>更新日期 <b>2026-11-28</b></span><span>适用范围 <b>总控后台 / 站点后台</b></span><span>文档状态 <b>一期开发与测试基线</b></span></div><div class="notice"><b>执行基线：</b>一期范围、业务规则、计算口径、异常处理和验收标准以本文为准。正式系统按本文实现；原型用于交互演示，实施要求不等于 HTML 已实现功能。</div><div class="prd-layout"><nav class="prd-toc" aria-label="PRD 目录"><strong>需求目录</strong><a href="#prd-01">01 文档基线与一期交付范围</a><a href="#prd-02">02 业务对象与账期</a><a href="#prd-03">03 角色权限与操作控制</a><a href="#prd-04">04 业务流程、状态与并发</a><a href="#prd-05">05 总控后台页面与交互</a><a href="#prd-06">06 站点后台、展示与导出</a><a href="#prd-07">07 完整计算口径与公式</a><a href="#prd-08">08 源数据归属、封账与金额精度</a><a href="#prd-09">09 月度汇率确认与锁定</a><a href="#prd-10">10 收款账户与结清</a><a href="#prd-11">11 抵扣额度、开版费用与人工结转</a><a href="#prd-12">12 异常处理、人工更正与错误提示</a><a href="#prd-13">13 数据结构、服务端约束与审计</a><a href="#prd-14">14 可复算样例</a><a href="#prd-15">15 开发测试验收清单</a><a href="#prd-16">16 实施交付与版本说明</a></nav><article class="prd-article"><section id="prd-01" class="prd-section"><div class="prd-sectionhead"><span>01</span><h2>文档基线与一期交付范围</h2></div><p>文档编号：BR-BILL-PRD。版本：V2.2。日期：2026-11-28。适用系统：总控后台、站点后台。本文为一期开发实现、接口联调和测试验收的统一需求基线；同一事项与 V1.x 文档不一致时，以本文为准。本文定义产品行为，不表示已核验或修改外部商务合同。</p><p>产品目标：按站点配置计费规则，每月先确认汇率，再对本账期全部厅主及站点计算账单，由总控逐单核对下发，站点查看并线下付款，财务登记结清。所有金额、状态、配置与处理依据均可追溯。</p><div class="prd-table-scroll"><table><thead><tr><th>范围</th><th>一期交付要求</th></tr></thead><tbody><tr><td>包含</td><td>单站点计费配置与版本；月度汇率确认；单账期全部站点批量计算及未下发草稿重算；逐单核对与下发；两端查询、明细、导出；正应付全额结清；零应付下发后自动结清；按站点读取生产收款配置及保存快照；人工额度结转记录；操作权限与审计。</td></tr><tr><td>不包含</td><td>自动定时出账、批量下发、部分付款登记、在线支付或链上自动到账识别、逾期停服、站点付款凭证上传、站点异议工单、账单撤回、系统化冲销重开或差额调账、业务后台收款账户维护页面及写入接口、跨月自动余额结转、站内信和邮件自动通知。</td></tr><tr><td>异常处理</td><td>已下发差错通过第 12 节人工异常台账处理；不开放修改已下发账单金额的接口，不删除原账单。人工异常处理是一期运营流程，系统化调账不属于一期。</td></tr><tr><td>交付与原型</td><td>HTML 用于演示交互。正式系统须实现本文全部一期要求。现有 HTML 中的合并角色、收款地址占位、模拟数据及浏览器本地存储不得直接作为生产实现。零应付自动结清、真实收款配置和源数据治理按本文开发验收。</td></tr></tbody></table></div></section>
<section id="prd-02" class="prd-section"><div class="prd-sectionhead"><span>02</span><h2>业务对象与账期</h2></div><div class="prd-table-scroll"><table><thead><tr><th>对象</th><th>定义</th></tr></thead><tbody><tr><td>厅主 / 站点 / 商户</td><td>厅主与站点为一对多。站点使用稳定 site_id 关联配置、账单和权限。总控展示地区、厅主名称、站点名称；站点后台保留地区 / 商户，其中商户对应同一 site_id。显示名称不得作为业务主键。</td></tr><tr><td>计费项 i</td><td>同一站点内，平台 ID + 游戏类型 + 游戏性质组成一条计费规则。先在该维度内汇总当月正负输赢，再计算抽成；不同计费项之间不抵亏。</td></tr><tr><td>币种</td><td>源统计及平台抽成为 BRL，维护费、低消、开版费、抵扣和实际应付为 USDT。不同币种不得直接相加。</td></tr><tr><td>账期</td><td>按固定 UTC−03:00 的自然月，区间为 [当月 1 日 00:00:00，次月 1 日 00:00:00)。2026-10 账期包含 10 月数据，不等于账单生成月份。数据库时间保存 UTC，接口携带时区或偏移。</td></tr><tr><td>时间展示</td><td>账期与统计截止点显示 UTC−03:00；总控操作时间统一显示北京时间 UTC+08:00，并显示时区标识。下载文件同时带时间及偏移。</td></tr><tr><td>唯一性</td><td>每个 site_id + 账期 + 结算币种仅一份当前有效账单；重算增加账单版本并归档原版本，不产生第二个有效编号。地区 + 账期 + 源币种 + 结算币种唯一对应一条当前月度汇率。</td></tr><tr><td>参与结算站点</td><td>范围由后台完整结算站点清单确定，包括本期已开通结算及有应收或结算数据的站点。停用后仍有本期结算数据或应收的站点不能漏算；正式免结算须有带生效账期和原因的授权记录。不得根据“已有配置”的集合反推完整站点范围。</td></tr></tbody></table></div></section>
<section id="prd-03" class="prd-section"><div class="prd-sectionhead"><span>03</span><h2>角色权限与操作控制</h2></div><p>权限按动作授权，同时叠加站点数据范围。批量计算涉及全部站点，只有具备全站结算范围的总控财务或管理员可以触发；其他人员可按授权范围查询和逐单操作。前端隐藏入口不能替代服务端鉴权。</p><div class="prd-table-scroll"><table><thead><tr><th>能力</th><th>配置人员</th><th>财务人员</th><th>站点人员</th></tr></thead><tbody><tr><td>查询 / 明细 / 导出</td><td>授权站点</td><td>授权站点</td><td>仅本站已下发账单</td></tr><tr><td>比例、费用、配置版本</td><td>可维护授权站点</td><td>只读；兼任配置权限后可维护</td><td>禁止</td></tr><tr><td>汇率确认及调整</td><td>禁止</td><td>具备全站汇率权限时可操作</td><td>禁止</td></tr><tr><td>全部站点批量计算 / 重算</td><td>禁止</td><td>具备全站计算权限时可操作</td><td>禁止</td></tr><tr><td>逐单下发</td><td>禁止</td><td>可操作授权站点</td><td>禁止</td></tr><tr><td>结清登记</td><td>禁止</td><td>可操作授权站点</td><td>禁止</td></tr><tr><td>生产收款配置维护</td><td>无页面或写权限</td><td>无页面或写权限；按授权只读查看账单收款快照</td><td>仅查看本站已下发快照，不可维护</td></tr><tr><td>额度台账</td><td>禁止</td><td>对应财务权限可维护</td><td>仅查看本站已下发账单中的额度结果</td></tr><tr><td>操作日志</td><td>查看授权范围内记录</td><td>查看授权范围内记录</td><td>禁止</td></tr><tr><td>角色授权</td><td>由现有总控系统管理员分配权限；权限变更记日志</td><td>不得通过业务接口自行扩大权限</td><td>禁止</td></tr></tbody></table></div><p>岗位名称用于说明权限职责，正式系统复用现有角色并按功能权限点、站点范围授权，不要求新建同名岗位。管理员可以同时拥有配置与财务权限，但不能通过业务后台维护生产收款配置。运营负责联系开发提交配置需求，具备生产权限的开发人员执行对应站点的收款配置。操作留痕记录实际登录用户，不统一写成“总控管理员”。单笔下发具有显式核对确认，不增加独立审批工作流。PRD 说明入口仅用于交互原型评审，正式站点后台不保留该入口及对应内容路由，也不展示角色切换、演示商户切换和演示重置。</p></section>
<section id="prd-04" class="prd-section"><div class="prd-sectionhead"><span>04</span><h2>业务流程、状态与并发</h2></div><p>主流程：配置与额度核对 → 数据封账 → 输入并确认本月汇率 → 全站批量计算 → 逐份核对 → 逐份下发 → 站点查询 → 正应付全额到账登记 / 零应付自动结清。由总控手动发起月结，无定时生成任务。</p><div class="prd-table-scroll"><table><thead><tr><th>状态</th><th>总控可执行</th><th>站点可见</th><th>流转规则</th></tr></thead><tbody><tr><td>待下发（draft）</td><td>查看、导出、批量重算、逐单下发</td><td>否</td><td>重算保持编号，版本 +1；校验未通过保持待下发。</td></tr><tr><td>待结清（sent）</td><td>查看、导出、登记足额结清</td><td>是</td><td>下发成功且应付大于 0 时进入；禁止重算、撤回或改价。</td></tr><tr><td>已结清（paid）</td><td>查看、导出、查看收款登记</td><td>是</td><td>正应付财务登记成功进入；零应付下发事务内自动进入。禁止覆盖金额、结清方式或凭证。</td></tr></tbody></table></div><ul><li>批量计算前校验整批站点完整性、适用配置、额度核对、数据封账和汇率版本。任何参与计算的站点失败，整批不发布新账单；已有账单保持原样。</li><li>已有待下发草稿时须勾选“确认重新计算并替换本期所有未下发草稿”。已下发及已结清单跳过且保持原快照；全部已下发时禁用计算。</li><li>计算任务成功后显示各站点版本、金额、状态与核对详情入口；新账单均为待下发，不自动下发。账单列表切换到本账期和全部厅主、全部站点、全部状态。</li><li>计算、下发、结清使用请求幂等标识与业务唯一键。重复请求返回原结果。读取后修改必须携带版本；配置、统计、汇率或账单状态在窗口期间变化，拒绝提交并要求刷新。</li><li>修改汇率与首笔下发使用同一账期锁，不能出现旧汇率账单已下发而月度汇率又更新。相同站点不同账期的额度消耗串行校验；有余额依赖时，前期未下发不能确认后期期初余额。</li><li>草稿计算不扣减额度。下发事务同时完成状态变更、额度实际消耗、月度汇率锁定与审计。零应付自动结清也包含在该事务中。网络超时先查请求结果，不盲目重新下发。</li></ul></section>
<section id="prd-05" class="prd-section"><div class="prd-sectionhead"><span>05</span><h2>总控后台页面与交互</h2></div><h3>MC-01 账单配置</h3><p>入口：月结账单 → 账单配置。筛选条件为厅主名称、站点名称，默认全部；厅主变化时站点选项限定为所属站点，不匹配的已选站点恢复全部。点击查询生效，重置恢复全部。显示当前结果数 / 配置总数；无结果显示空态。编辑保存和关闭版本弹窗保留查询条件。</p><div class="prd-table-scroll"><table><thead><tr><th>区域</th><th>字段与行为</th></tr></thead><tbody><tr><td>配置列表</td><td>地区、厅主名称、站点名称、规则数、维护费、抽成低消、汇率按月确认提示、生效账期 / 版本、编辑比例与费用、版本记录。</td></tr><tr><td>平台规则</td><td>平台、类型、性质、抽成方式（游戏盈利 GGR / 有效投注）、比例。组合不得重复；0% 是有效规则。数据中出现无规则的有业务计费项时阻止计算。</td></tr><tr><td>费用配置</td><td>维护费 M、抽成低消 L、本期开版费 O、期初开版抵扣额度 E、计划开版抵扣 D、计划其他抵扣 X、生效账期、原因。E 为读取本期财务核对结果的只读字段；D、X 只能在已核定额度内设置计划，配置人员不能创建来源余额。额度来源与核对记录见第 11 节。</td></tr><tr><td>保存规则</td><td>所有费用非负且最多 2 位小数；比例 0–100 且最多 2 位小数；D≤E；原因去空白后 1–200 字符。新版本生效账期必须晚于本站最近已下发账期。保存成功产生版本，失败保留输入。</td></tr><tr><td>生效规则</td><td>选择生效账期不晚于目标账期的最近配置，同生效月使用最高版本。M、L 和平台比例持续生效；O、D、X 只在配置对应账期使用，跨期取 0。E 由本期额度核对记录提供，不直接沿用历史配置。</td></tr><tr><td>历史版本</td><td>保存完整配置、差异、原因、操作者与时间。未来版本不影响此前账期。配置保存不更改已有账单金额；受影响草稿标记需重算。</td></tr></tbody></table></div><h3>MC-02 账单管理</h3><p>筛选地区、厅主、站点、状态、账期，初始全部。厅主与站点联动。提供查询、重置、上月账期、全部账期及导出。每页默认 20 条，可切换 50 / 100 条；过滤后回到第一页。排序为账期倒序、site_id 升序；汇总及导出覆盖全部查询结果，不仅当前页。</p><p>列表字段：账期 / 编号 / 版本、地区、厅主名称、站点名称、抽成 BRL、维护费 USDT、低消补差 USDT、合计 USDT 与 BRL、状态、下发时间、详情及可用操作。草稿未下发时间显示“尚未下发”；过期草稿显示“汇率 / 配置 / 数据已变化，需重新计算”。</p><p>页面顶部业务入口为账单配置、开始月结。正式“开始月结”默认上一个已结束自然月，不受列表历史查询条件影响；HTML 演示固定为 2026-10。汇率未确认进入第 1 步，已确认进入第 2 步。不增加列表旁的独立“月度汇率设置”按钮；流程区保留本期汇率查看。</p><h3>MC-03 计算月结账单</h3><p>弹窗固定显示“厅主名称：所有”“站点名称：所有”，两个输入框禁用。账期可选择，汇率只读。展示全站总数、本次新增数、重算草稿数和保留已下发数。计算按钮为“计算全部账单”。未确认汇率、存在校验失败或全部站点已下发时禁用，并展示原因。列表筛选、配置筛选和详情入口均不缩小计算范围。</p><h3>MC-04 详情、核对与下发</h3><p>详情展示编号、账期、站点归属、账单版本、配置 / 汇率 / 数据 / 收款版本、币种、所有费用和抵扣、原始输赢、有效投注、抽成明细、状态时间、收款快照及结清记录。草稿详情提供“重新计算本期账单”和“下发至站点”。重算入口进入全站批量范围。</p><p>下发确认弹窗展示单据、金额、汇率、收款账户及可选备注（0–200 字符），勾选“已核对金额、明细及收款资料”后提交。前置校验失败禁止下发；成功后仅对应站点可见。已下发单无编辑或重算入口。</p><h3>MC-05 操作记录</h3><p>搜索区固定显示“厅主名称：所有”“站点名称：所有”，均禁用；点击查询刷新当前授权范围内全部记录。全站账号看到所有厅主及站点，受限账号仍只获取服务端授权范围。搜索不继承其他页面条件。列表字段：时间、厅主、站点、操作人、类型、结果、变更说明；跨站点操作显示全部厅主 / 全部站点，关联可展开的站点明细。默认操作时间倒序，每页 20 条，支持 50 / 100 条及无数据空态。</p></section>
<section id="prd-06" class="prd-section"><div class="prd-sectionhead"><span>06</span><h2>站点后台、展示与导出</h2></div><p>站点身份由登录态绑定，不能通过参数查询其他站点。仅能查看已下发的待结清和已结清账单，包括零应付单。当前配置、内部汇率依据、草稿及内部操作日志不返回站点接口。</p><div class="prd-table-scroll"><table><thead><tr><th>页面 / 能力</th><th>实现要求</th></tr></thead><tbody><tr><td>账单列表</td><td>保留地区 / 商户字段；查询状态、账期。显示账单生成日期 / 账期、开版费用、剩余可抵扣开版费、本月实际开版抵扣、实际其他抵扣、维护费、抽成 BRL、低消补差、低消、双币合计、状态、详情。分页与总控一致。</td></tr><tr><td>账单详情</td><td>读取下发快照，金额和计费规则与总控一致；展示平台、类型、性质、公司输赢、投注、有效投注、抽成方式、比例、抽成额；收款资料、下发备注、结清方式及凭证只读。</td></tr><tr><td>空态</td><td>暂无符合条件的账单，总控下发后将在这里显示。不能以草稿填充空列表。</td></tr><tr><td>列表导出</td><td>导出全部匹配行；包含编号、版本、归属、账期、双币金额、费用抵扣、状态与时间。总控列厅主 / 站点，站点列地区 / 商户。</td></tr><tr><td>明细导出</td><td>包含源统计、每项抽成、费用、期初 / 期末余额、计划 / 实际抵扣、汇率及版本、收款版本和结清信息。站点文件不含内部原因及其他站点数据。</td></tr><tr><td>精度与格式</td><td>UTF-8 CSV 带 BOM；投注、派彩、有效投注、GGR 按汇总表已完成小数取舍的结果和字段精度展示、导出；可补零，不二次截断或重新舍入。账单费用及应付显示 2 位，汇率按确认精度输出。文本以 =、+、-、@ 等起始时转义，负数金额仍以数值输出。</td></tr><tr><td>打印</td><td>详情打印包含编号、账期、站点、全部费用明细、汇率、收款资料及状态；隐藏按钮和导航，多页重复表头。</td></tr><tr><td>下发通知</td><td>一期下发后账单在站点列表可见，不自动发送站内信或邮件，不记录已读、不等同于已付款。商务通过既有线下渠道通知；通知不改变账单状态。</td></tr></tbody></table></div></section>
<section id="prd-07" class="prd-section"><div class="prd-sectionhead"><span>07</span><h2>完整计算口径与公式</h2></div><p><b>GGR＝公司输赢＝投注额 − 派彩（含返还本金）</b>，正数公司赢，负数公司输。GGR 不扣活动、返水、代理佣金、税费、供应商费用或维护费。相同站点、计费项、币种和账期的投注与派彩使用同一注单集合 J。</p><div class="prd-table-scroll"><table><thead><tr><th>符号</th><th>定义 / 计算式</th><th>币种与限制</th></tr></thead><tbody><tr><td>Wᵢ</td><td>汇总表在集合 J 下已统计并完成小数取舍的投注金额</td><td>BRL；直接读取汇总表最终结果，保留其字段精度。</td></tr><tr><td>Qᵢ</td><td>汇总表在同一 J 下已统计并完成小数取舍的派彩（含本金）</td><td>BRL；供应商净赢利由汇总表侧统一转换为含本金派彩，月结不重复加本金。</td></tr><tr><td>Gᵢ</td><td>业务定义为投注额 − 派彩；计费输入取汇总表按该定义及既有取舍顺序产出的最终 GGR</td><td>BRL；公司视角，玩家净输赢 = −Gᵢ。若汇总表先计算 GGR 再分别取舍各字段，不能用展示后的 Wᵢ−Qᵢ 覆盖其最终 GGR。</td></tr><tr><td>Vᵢ</td><td>汇总表在 J 中按平台规则统计并完成小数取舍的有效投注</td><td>BRL；沿用汇总表字段精度，不能用投注额或输赢绝对值替代；负有效投注拒绝。</td></tr><tr><td>Bᵢ</td><td>按 GGR：max(Gᵢ,0)；按有效投注：Vᵢ</td><td>同计费项内先汇总再归零；不同计费项不抵亏、不跨平台、不跨月结转。原始负 GGR 仍展示。</td></tr><tr><td>Pᵢ</td><td>适用计费规则中的百分比</td><td>5.5 表示 5.5%，计算除以 100。</td></tr><tr><td>R</td><td>该地区、本账期已确认的 BRL / USDT 汇率</td><td>1 USDT = R BRL；R&gt;0，最多 4 位小数。</td></tr><tr><td>M / L</td><td>维护费 / 抽成低消</td><td>USDT；按自然月全额计收，开停站月不按天折算；维护费不计入低消。</td></tr><tr><td>O</td><td>本期新增开版应收</td><td>USDT；只计入指定账期，不自动产生抵扣额度。</td></tr><tr><td>E / D / X</td><td>本期期初开版抵扣余额 / 本月计划开版抵扣 / 本月计划其他抵扣</td><td>USDT；非负，D≤E；来源见第 11 节。</td></tr></tbody></table></div><p>投注、派彩、有效投注及 GGR 的输入值、精度和小数取舍顺序，以汇总表已产生的最终结果为准。下列 round₂ 仅用于账单新增的抽成、换汇及费用计算，表示十进制 ROUND_HALF_UP 到 2 位小数，不重新处理汇总表源金额。以下依序计算，不交换低消与抵扣顺序。</p><div class="prd-table-scroll"><table><thead><tr><th>编号 / 结果</th><th>公式</th><th>约束</th></tr></thead><tbody><tr><td>F08 单计费项抽成 Cᵢ</td><td>round₂(Bᵢ × Pᵢ ÷ 100)</td><td>先算每个计费项，不将全站 GGR 汇总后套用单一比例。</td></tr><tr><td>F09 抽成合计 C</td><td>Σ Cᵢ</td><td>BRL；累加已舍入的抽成。</td></tr><tr><td>F10 折合抽成 U</td><td>round₂(C ÷ R)</td><td>USDT。</td></tr><tr><td>F11 低消补差 T</td><td>round₂(max(L − U,0))</td><td>U≥L 时为 0；U=0、L&gt;0 时补 L。</td></tr><tr><td>F12前置 抵扣前应付 A</td><td>round₂(U + T + M + O)</td><td>等价于 max(U,L)+M+O；不得再额外加一次完整低消。</td></tr><tr><td>F12 实际开版抵扣 D′</td><td>round₂(min(D,E,A))</td><td>先使用开版抵扣。</td></tr><tr><td>F13 实际其他抵扣 X′</td><td>round₂(min(X,max(A−D′,0)))</td><td>再使用其他抵扣，不产生负应付。</td></tr><tr><td>F14 应付 F</td><td>round₂(A−D′−X′)</td><td>USDT，主结算金额；可为 0。</td></tr><tr><td>F15 开版期末余额 E′</td><td>round₂(E−D′)</td><td>只扣实际使用额；不把未用计划额另加一遍。</td></tr><tr><td>F16 未使用抵扣</td><td>计划开版未用 = D−D′；其他未用 = X−X′</td><td>计划开版未用额不是总余额 E′；其他未用额按第 11 节人工结转。</td></tr><tr><td>F17 BRL 展示合计 Fᴮ</td><td>F=0 时 Fᴮ=0；F&gt;0 时 Fᴮ=round₂(max(C+(T+M+O−D′−X′)×R,0))</td><td>保留原币抽成精度；BRL 为参考，收款以 USDT 的 F 为准。</td></tr><tr><td>F18 展示尾差 Δ</td><td>Fᴮ−round₂(F×R)</td><td>只记录展示换算差，不加到应付、不额外收款。尾差不限定为 0.01。</td></tr></tbody></table></div><p><b>抵扣范围：</b>D′、X′ 均可抵扣抽成、低消补差、维护费及本期开版费。因此抵扣后应付允许低于 L。低消限制作用于抵扣前的抽成，不是最终实付下限。原始负 GGR 不能抵减维护费、低消或其他计费项抽成。</p><h3>列表统计与汇总</h3><p>B 为当前角色授权范围内的有效账单集合：总控含三种状态，站点仅含本站已下发账单；S 为 B 经过当前查询条件后的集合。顶部统计基于 B，不随筛选改变；列表合计及导出基于 S，分页不影响汇总。</p><div class="prd-table-scroll"><table><thead><tr><th>统计项</th><th>计算式</th></tr></thead><tbody><tr><td>总控账单总数 / 站点已接收数</td><td>COUNT(B)，按有效编号去重，历史版本不另计数。</td></tr><tr><td>总控待下发数 / 站点待结清数</td><td>分别 COUNT(B.status=draft) / COUNT(B.status=sent)。</td></tr><tr><td>待结清金额</td><td>Σ F，仅统计 B.status=sent；零应付已自动结清不计入。</td></tr><tr><td>已结清数</td><td>COUNT(B.status=paid)，含手工及零应付自动结清。</td></tr><tr><td>查询总条数</td><td>COUNT(S)，不是当前页行数。</td></tr><tr><td>维护费 / 抽成 / 低消补差合计</td><td>分别 Σ M（USDT）、Σ C（BRL）、Σ T（USDT），不跨币种求和。</td></tr><tr><td>查询合计</td><td>Σ F（USDT）、Σ Fᴮ（BRL）；取历史快照，不按最新汇率换算。</td></tr><tr><td>规则数 / 明细条数</td><td>分别为配置组合数、账单快照明细行数；含 0 抽成规则。</td></tr></tbody></table></div></section>
<section id="prd-08" class="prd-section"><div class="prd-sectionhead"><span>08</span><h2>源数据归属、封账与金额精度</h2></div><h3>DATA-01 月结统计集合</h3><p>以下规则由数据中心汇总表侧执行；月结按站点、账期、平台 / 类型 / 性质、币种及汇总版本读取最终结果，不再次拉取逐笔注单另行聚合。采用已结算业务口径，以注单首次有效结算时间归属自然月。跨月下注、本月首次结算的注单计入本月，投注与派彩整笔归入同一账期。唯一键为站点 + 供应商 + 供应商注单号；重复回调更新同一注单版本，不能新增统计次数。有效投注采用数据中心的平台规则版本，随账单记录。</p><div class="prd-table-scroll"><table><thead><tr><th>场景</th><th>归属及处理</th></tr></thead><tbody><tr><td>未结算注单</td><td>不计入本期，结算后按首次有效结算时间归属；不得仅计投注不计对应派彩。</td></tr><tr><td>全额取消 / 原单退款</td><td>原单失效，投注、派彩、有效投注同时排除；退回本金不是额外派彩。封账前以最终有效版本重建集合。</td></tr><tr><td>部分取消 / 部分退款</td><td>以供应商最终有效下注、结算返还和有效投注版本统计；退款与有效返还分字段处理，禁止重复相加。</td></tr><tr><td>重结算</td><td>保持原归属账期，以版本替换原结果。封账前按最新版本统计；封账后进入异常记录，不将整单再计入新月。</td></tr><tr><td>现金及已入账优惠投注</td><td>主钱包可用余额下注纳入，包含充值本金和已实际入账、可用于真实游戏的优惠资金；对应派彩完整纳入。优惠发放金额不从 GGR 再扣除。</td></tr><tr><td>免费旋转 / 免费投注</td><td>计费集合纳入实际可兑换收益的真实免费游戏记录：实际扣款为 0 则 W=0，Q 为实际结算返还；供应商标称面额不伪造为投注。有效投注按已配置的平台认定规则统计。无现金价值、无可兑换收益的纯试玩记录，投注与派彩一起排除。</td></tr><tr><td>首次结算回调迟到</td><td>按源业务首次有效结算时间归属，不按系统接收时间移月。未封账时纳入；封账后进入异常处理。</td></tr><tr><td>封账后但未下发</td><td>财务登记重开原因，数据中心重开、更新版本、再次封账；受影响草稿失效并重算。不自动冲入已封账数据集。</td></tr><tr><td>已下发后变化</td><td>原快照不变，记录原单、原账期、新旧金额及差额，进入第 12 节人工异常处理；不自动覆盖或自动算入后续账单。</td></tr></tbody></table></div><p>数据中心为每站点 / 账期提供汇总表标识、数据版本、小数取舍规则标识、字段精度、截止点、封账状态、计费项明细、总注单数和金额校验结果。计算必须使用同一版本的投注、派彩、有效投注及 GGR，不混用不同汇总粒度或版本。只有已结束、已封账、完整性校验通过的账期可计算。零流水必须由数据源明确返回“已封账且无业务”，不能把超时、缺项或空响应作为 0。下发前再次比对数据版本，发生变化即拒绝下发。</p><h3>DATA-02 精度与舍入</h3><ul><li>月结以汇总表已产生、已完成小数取舍的金额为唯一统计输入，字段精度与取舍规则沿用汇总表定义，不另外规定 DECIMAL(38,18) 或 18 位小数上限。传输和存储使用能无损承接汇总表结果的十进制格式；不符合已约定字段定义的数据拒绝使用并提示数据异常。</li><li>直接读取汇总表的 W、Q、V 及 GGR 最终值。月结不回溯逐笔原始高精度数据重新汇总，不恢复已舍弃的小数，也不对输入再做截断或舍入。汇总表已有 GGR 时直接使用；没有 GGR 字段时由数据中心按汇总表同一计算和取舍规则补齐后提供，月结不自行选取另一套规则。</li><li>计费比例最多 2 位小数，月度汇率最多 4 位，费用与人工额度最多 2 位。超过允许精度的输入阻止提交，不静默修正。</li><li>计费项抽成、换汇、费用抵扣按第 7 节指定节点 ROUND_HALF_UP；负数精确半值远离 0，例如 −1.005 → −1.01。后续计算使用该节点已舍入值，不能先全算完再统一舍入。</li><li>统计字段在月结页面、账单快照及导出中与对应汇总表结果一致，字段小数位按汇总表定义保留，可补零但不得改变数值。抽成、费用及应付保持 2 位。使用精确十进制计算，不使用二进制浮点比较结清金额。汇总数据或取舍规则发生变化须生成新版本，未下发草稿失效并重算，已下发账单保持原快照。</li><li>异常金额、负有效投注、丢失平台规则和供应商字段含义不匹配时阻止封账。数据异常修复后重新执行封账和草稿计算。</li></ul></section>
<section id="prd-09" class="prd-section"><div class="prd-sectionhead"><span>09</span><h2>月度汇率确认与锁定</h2></div><p>一期采用财务人工核定的月度结算汇率。业务依据为财务出具的《月度结算汇率确认单》，系统不直接接入市场报价、不自动选取交易平台价格。确认单必须记录原始报价渠道 / 凭据、BRL/USDT 币对、取价时间及其时区、采用价格类型（时点价 / 区间均价）、最终 R、确认人和确认时间。使用间接币对时记录每个换算项及公式，禁止默认 USDT 等于 USD。</p><div class="prd-table-scroll"><table><thead><tr><th>环节</th><th>规则</th></tr></thead><tbody><tr><td>首次输入</td><td>新账期汇率为空，R&gt;0、最多 4 位小数，依据 1–200 字符，并关联确认单编号 / 附件。不得自动沿用上月或站点长期配置值。</td></tr><tr><td>确认</td><td>独立保存月度汇率，不生成、不修改账单。成功显示已确认，可进入计算；取消未保存输入不生效，已确认记录不因退出而撤回。</td></tr><tr><td>未下发前修改</td><td>填写原因并产生新汇率版本；本期所有旧汇率草稿标记过期，阻止下发。相同值不重复保存版本。</td></tr><tr><td>首笔下发后</td><td>本期 R 锁定，已结清零应付单也触发锁定；剩余站点使用该 R 计算。不能删除或改写已锁定月度记录。</td></tr><tr><td>历史数据</td><td>保留历史账单汇率；同月历史下发汇率全部一致时，仅允许确认同值；不一致时阻止该月统一计算，登记异常处理。</td></tr><tr><td>快照</td><td>每张账单保存 R、币对、月度汇率版本、确认人、确认时间和依据引用；站点只看到数值、方向、版本和确认时间，不展示内部依据。</td></tr></tbody></table></div></section>
<section id="prd-10" class="prd-section"><div class="prd-sectionhead"><span>10</span><h2>收款账户与结清</h2></div><h3>PAY-01 按站点配置生产收款信息</h3><p>收款信息涉及财务隐私及生产权限，由运营人员联系开发，通过受控的生产配置流程维护对应站点的账户名称、结算币种、网络、收款地址、生效账期、状态、联系人及修改原因。配置必须绑定 site_id，不按地区使用一个公共默认账户，也不能在缺少本站配置时回退到其他站点账户。业务后台不提供收款账户新增、编辑、删除页面或写入接口。运营负责提交站点标识、收款资料及变更依据，具备生产权限的开发人员完成配置及验证，留存需求编号、执行人、执行时间和版本。一期使用 USDT / TRC20；配置变更产生新版本，旧版本保留。</p><ul><li>生产配置生效前校验站点标识、必填字段、TRON Base58Check 地址编码及校验和、币种和网络匹配，地址去首尾空格后存储。运营提交经核对的账户归属及网络依据，开发核对需求编号与配置结果；格式校验不能代替账户归属核对。同一 site_id、币种、网络和账期仅匹配一个有效版本，不允许有效期重叠。</li><li>生成草稿时按 site_id、结算币种、网络和账期读取本站适用账户版本并存快照；缺失、停用或校验失败的账户阻止生成和下发。下发前重新核对适用账户版本，已变化则草稿失效、需重算。</li><li>下发快照包含 site_id、账户名称、币种、网络、地址、联系人和生产配置版本。新版本不替换已下发账单。已下发账户失效时，运营联系开发核查生产配置，同时登记人工异常并联系对应站点，不能静默替换历史快照或引导到未核实的新地址。配置渠道不得包含私钥、助记词或支付访问密钥；业务日志记录站点、版本和需求编号，地址脱敏，禁止将完整收款配置公开到其他站点。</li></ul><h3>PAY-02 正应付全额结清</h3><p>仅 F&gt;0 且待结清的账单显示登记结清。字段：实收 H（USDT，最多 2 位）、TRC20 交易哈希 / 财务到账凭证号、实际到账时间、到账确认勾选。系统预填应付用于核对，财务仍须核实实际到账。H 必须等于 F；少付、多付、币种不符、空凭证或未确认到账均拒绝，不改变状态。</p><p>链上凭证记录 TRC20 网络，交易哈希为 64 位十六进制字符串；内部财务凭证为去首尾空白后的 1–100 字符可追溯编号。实收非负、最多 2 位小数，必须明确填写，不将空输入视为 0。凭证在同一收款主体下不能重复用于结清不同账单；已成功请求重试返回同一结果。一次转账覆盖多张账单不在一期登记方式内，由财务异常流程处理，不伪造多次独立到账。足额收款后服务端原子更新已结清、实收、到账时间、登记人、登记时间、凭证及审计。</p><h3>PAY-03 零应付结清</h3><p>F=0 的草稿仍需人工核对并下发。下发成功的同一事务内自动标记已结清，实收 H=0，结清方式“零应付自动结清”，凭证为空且不显示缺失错误，记录原因、下发人和系统结清时间。草稿阶段不自动结清。下发失败则保持待下发，不扣额度。零应付不调用付款或到账接口。</p></section>
<section id="prd-11" class="prd-section"><div class="prd-sectionhead"><span>11</span><h2>抵扣额度、开版费用与人工结转</h2></div><p>开版费用 O 为应收项目，开版抵扣余额 E 为独立额度。生成、下发或收取 O 均不自动增加 E。一期不实现开版费到账自动返还额度；新增额度由财务按批准文件手动登记，关联到账或授权依据、金额、可用起始账期和操作原因，不允许同一来源重复登记。</p><div class="prd-table-scroll"><table><thead><tr><th>对象</th><th>正式处理规则</th></tr></thead><tbody><tr><td>开版额度期初</td><td>本期 E = 上期最近已下发账单的 E′ + 自该期末之后生效且未计入的批准增加额 − 批准减少额。首次上线使用经财务核对的期初导入记录。跳月仍从最近已下发期末起算，不伪造中间月消耗。</td></tr><tr><td>人工核对</td><td>本期生成前创建额度核对记录，列明上期单据、增减来源、计算结果、核对人和时间，并保存本期配置。存在余额或本期额度调整时必须有当期核对记录；无历史余额且无调整的站点按 0 并记录系统依据。</td></tr><tr><td>计划与实际</td><td>D 为使用计划，D′ 为实际消耗。草稿不扣真实额度；下发时按 D′ 一次扣减并记录账单编号。重算、重复下发、结清都不再次扣减。</td></tr><tr><td>其他抵扣来源</td><td>每条额度分配来源编号、批准金额、已用额、余额、可用账期及可选到期账期。没有到期账期的长期有效；来源可追溯，不能按月复制整笔原始额度。</td></tr><tr><td>其他抵扣截断</td><td>本期 X′ 按公式使用，未使用 X−X′ 保留为原来源未用余额，不因应付不足而作废。来源剩余总额 = 来源可用总额 − 累计实际消耗 − 已批准取消额，不以 X−X′ 代替来源总余额。</td></tr><tr><td>其他抵扣跨月</td><td>不自动带入下期。财务核对未使用且未到期的来源余额，人工分配为下期 X；没有分配则下期不使用，但来源余额保留。到期或取消必须记录原因、金额、审批依据和时间。</td></tr><tr><td>多来源抵扣</td><td>先按到期账期从近到远、无到期最后，再按来源创建时间和 ID 消耗；保存每条来源分摊明细，分摊合计必须等于 X′。</td></tr><tr><td>余额一致性</td><td>额度核对与下发分别携带额度版本；被另一账单消耗或被调整后，旧草稿拒绝下发并重算。对有结转依赖的站点，必须先完成前期下发，再核对后期余额。</td></tr></tbody></table></div><p>人工结转是一期正式流程；跨月自动创建配置、自动搬运余额及自动返还开版额度均不实现。额度台账、来源和消耗记录必须持久化，人工核对不意味着允许绕过余额校验。</p></section>
<section id="prd-12" class="prd-section"><div class="prd-sectionhead"><span>12</span><h2>异常处理、人工更正与错误提示</h2></div><div class="prd-table-scroll"><table><thead><tr><th>触发条件</th><th>系统行为 / 文案</th></tr></thead><tbody><tr><td>汇率为空、≤0 或超精度</td><td>阻止确认：请输入大于 0、最多 4 位小数的月度汇率。</td></tr><tr><td>未确认月度汇率</td><td>禁用计算，服务端拒绝：请先确认本期月度汇率。</td></tr><tr><td>账期未结束 / 数据未封账</td><td>整批阻止，显示具体站点与数据状态；禁止用空统计生成账单。</td></tr><tr><td>配置 / 收款账户 / 额度核对缺失</td><td>整批阻止并列明站点及缺失项目；完成后重新发起计算。</td></tr><tr><td>已有草稿未确认替换</td><td>阻止保存：请确认替换本期所有未下发草稿。</td></tr><tr><td>版本已变化</td><td>拒绝计算或下发：数据或配置已变化，请刷新核对并重新计算。</td></tr><tr><td>全部已下发</td><td>禁用计算：本期全部站点账单均已下发，无需再次计算。</td></tr><tr><td>保存失败 / 部分任务失败</td><td>整批不发布，已有账单不变；保留输入，重试前查询请求结果。</td></tr><tr><td>实收不等于应付</td><td>拒绝结清：一期仅支持足额结清，请核对实收金额。</td></tr><tr><td>重复凭证 / 缺少确认</td><td>拒绝结清，不生成第二条成功记录；零应付自动结清不执行凭证校验。</td></tr><tr><td>未授权访问</td><td>返回权限错误；不给出其他站点明细或通过计数泄露其信息。</td></tr><tr><td>无结果</td><td>显示明确空态与查询条件，不显示加载成功但内容为空的无提示页面。</td></tr></tbody></table></div><h3>已下发账单差错的人工处理</h3><p>财务建立异常台账：异常编号、原账单 / 版本、原注单 / 账期、原因、新旧金额、差额方向、处理责任人、批准依据及完成证据。原账单快照保持不变，不将原单删除后重新生成。异常台账由现有财务流程维护，系统审计关联异常编号。</p><ul><li>需退还或减免的差额，经批准可登记可追溯的其他抵扣额度，用于后续账期；实际退款走现有财务付款流程，记录真实退款依据，不冒充账单结清。</li><li>需补收的差额，通过现有财务单独补收并登记异常编号及到账凭证；不得把补收随意写入开版费或修改原单。</li><li>原正应付账单仍按真实到账及其原应付判断结清。少付、多付或争议状态不能通过虚填实收强制结清；在异常台账处理，系统不提供部分结清或冲销入口。</li><li>处理完成需核对原单、差额、额度或资金证据及双方沟通记录，关闭异常台账。人工流程不替代正式账单记录，也不自动改写列表历史金额。</li></ul></section>
<section id="prd-13" class="prd-section"><div class="prd-sectionhead"><span>13</span><h2>数据结构、服务端约束与审计</h2></div><div class="prd-table-scroll"><table><thead><tr><th>对象</th><th>必备数据与约束</th></tr></thead><tbody><tr><td>站点结算档案</td><td>site_id、厅主 ID、地区、计费启停账期、参与结算标识及原因；历史单保存当时名称 / 归属快照。</td></tr><tr><td>配置与版本</td><td>site_id、版本、生效账期、平台规则、费用、计划抵扣、原因、操作者、时间；不可只保留最后一次配置。</td></tr><tr><td>月度汇率</td><td>地区、账期、币对、R、版本、依据引用、取价元数据、确认人 / 时间、锁定状态；锁定由已下发单派生。</td></tr><tr><td>数据封账快照</td><td>site_id、账期、汇总表标识、统计集合版本、小数取舍规则标识、字段精度、截止点、注单数量、汇总表最终金额、各计费项合计、有效投注规则版本、完整性结果。</td></tr><tr><td>计算任务</td><td>任务 ID、请求幂等键、账期、站点范围快照、引用版本、状态、失败明细、创建人 / 时间、完成时间；完成前结果不可对外作为有效账单。</td></tr><tr><td>账单与明细</td><td>唯一编号、site_id、账期、当前版本、状态、各费用 / 抵扣 / 金额、配置 / 汇率 / 数据 / 账户 / 额度版本、原明细快照、创建 / 下发 / 结清时间、备注。</td></tr><tr><td>历史版本</td><td>重算前完整账单、归档原因、操作者、时间；只能新增归档，不改写历史版本。</td></tr><tr><td>额度来源与消耗</td><td>来源 ID、类型、批准额度、有效期、剩余额度、调整依据、核对记录、账单消耗分摊、版本；下发唯一消耗，禁止余额为负。</td></tr><tr><td>站点生产收款配置</td><td>site_id、配置 ID、版本、币种 / 网络、地址、联系人、生效期、状态、需求编号、核验依据、生产执行人 / 时间。仅受控生产流程写入，业务系统按本站及账期读取快照。</td></tr><tr><td>结清记录</td><td>账单 ID、方式（manual / zero_auto）、实收、币种、凭证类型 / 编号、实际到账时间、登记时间、操作者、幂等键；zero_auto 的凭证及到账时间可空。</td></tr><tr><td>审计记录</td><td>操作者 ID / 名称、动作、对象及站点范围、前后版本和字段差异、结果、原因、时间、请求 ID；成功与失败均保留，业务界面不可删除。</td></tr></tbody></table></div><p>所有写接口同时校验动作权限、站点范围、状态、预期版本和幂等键。导出接口执行同样的数据权限，不信任前端传入厅主或 site_id。金额以十进制字符串传输，时间采用 ISO 8601，月份采用 YYYY-MM。</p><div class="prd-table-scroll"><table><thead><tr><th>服务能力</th><th>输入 / 返回契约</th></tr></thead><tbody><tr><td>配置查询 / 保存</td><td>查询厅主及站点；保存费用、规则、生效月、原因及预期版本；返回新配置版本或字段错误。</td></tr><tr><td>汇率查询 / 确认</td><td>地区、账期、币对、R、依据、预期版本；返回确认版本和是否锁定。</td></tr><tr><td>月结校验 / 计算</td><td>账期、确认替换标识、范围校验令牌、幂等键；范围由服务端完整站点集合产生，返回任务状态与逐站结果。</td></tr><tr><td>账单查询 / 详情 / 导出</td><td>按权限、状态、账期、站点查询；详情指定编号 / 版本；不从当前配置临时重算展示金额。</td></tr><tr><td>单笔下发</td><td>账单 ID、预期版本、核对勾选、备注、幂等键；返回 sent 或 paid（零应付）及实际时间。</td></tr><tr><td>结清登记</td><td>账单 ID、预期版本、实收、到账时间、凭证、到账确认、幂等键；返回结清记录，状态冲突返回原结果或明确错误。</td></tr><tr><td>生产收款配置读取</td><td>账单服务按 site_id、币种、网络和账期读取生效配置及版本；业务后台无写入接口，不返回其他站点账户。</td></tr><tr><td>额度维护</td><td>按财务权限保存额度来源、版本与核对依据，返回版本及有效性；失败不改变旧值。额度权限不包含收款配置修改。</td></tr><tr><td>操作记录查询</td><td>按服务端授权范围返回全部类型的日志，支持分页；固定“所有”字段不放宽数据权限。</td></tr></tbody></table></div></section>
<section id="prd-14" class="prd-section"><div class="prd-sectionhead"><span>14</span><h2>可复算样例</h2></div><p>以下样例金额除注明 BRL 外均为 USDT。测试必须同时核验中间值、最终金额和舍入节点。</p><div class="prd-table-scroll"><table><thead><tr><th>编号 / 场景</th><th>输入</th><th>预期输出</th></tr></thead><tbody><tr><td>EX-01 公司赢 / 输</td><td>投注 1,000，派彩含本金 800 / 1,200</td><td>GGR 分别 200 / −200；按 5% 抽成为 10 / 0 BRL，原始负数仍展示。</td></tr><tr><td>EX-02 项内净额</td><td>同计费项两笔 GGR +100、−80，比例 10%</td><td>月 GGR=20，抽成 2 BRL；不得逐笔归零算成 10。</td></tr><tr><td>EX-03 跨平台不抵亏</td><td>平台 A GGR=100、B GGR=−80，均 10%</td><td>A 抽成 10，B 为 0，合计 10 BRL；不得合并算成 2。</td></tr><tr><td>EX-04 有效投注</td><td>GGR=−200，V=1,000，按有效投注 1%</td><td>抽成 10 BRL，负盈利不影响有效投注计费。</td></tr><tr><td>EX-05 原页面复算</td><td>C=44,751.68 BRL，R=5.43，M=3,000，L=5,000，O/D/X=0</td><td>U=8,241.56；T=0；F=11,241.56；Fᴮ=61,041.68 BRL；Δ=0.01 BRL。</td></tr><tr><td>EX-06 换汇</td><td>同 EX-05，但 R=6</td><td>U=7,458.61；T=0；F=10,458.61；Fᴮ=62,751.68 BRL。</td></tr><tr><td>EX-07 低消</td><td>C=10,860 BRL，R=5.43，M=3,000，L=5,000</td><td>U=2,000；T=3,000；F=8,000。</td></tr><tr><td>EX-08 抵扣顺序</td><td>A=8,000，E=5,000，D=2,000，X=500</td><td>D′=2,000；X′=500；F=5,500；E′=3,000。</td></tr><tr><td>EX-09 零应付与截断</td><td>A=8,000，E=20,000，D=10,000，X=500</td><td>D′=8,000；X′=0；F=0；E′=12,000；其他未用=500，来源余额保留。下发后自动结清。</td></tr><tr><td>EX-10 按汇总表最终值计费</td><td>汇总表最终 W=0.02 BRL、Q=0、GGR=0.02、比例 80%；底层取舍前合计为 0.015</td><td>按最终 GGR=0.02 计费，抽成 round₂(0.02×80%)=0.02 BRL。禁止回溯 0.015 算成 0.01；页面、快照和导出统计值均与汇总表 0.02 一致。</td></tr><tr><td>EX-11 余额结转</td><td>上期 E′=3,000；新增 1,000；批准减少 200</td><td>本期 E=3,800；计划抵扣 500、实际 500 后 E′=3,300。</td></tr><tr><td>EX-12 查询与待结清不同</td><td>筛选结果有草稿 8,000、待结清 5,500、已结清 3,000</td><td>查询合计 16,500；待结清金额 5,500；总数 3，待下发 1，已结清 1。</td></tr></tbody></table></div></section>
<section id="prd-15" class="prd-section"><div class="prd-sectionhead"><span>15</span><h2>开发测试验收清单</h2></div><p>验收以正式接口、持久化数据和实际权限执行。通过 HTML 模拟操作不等于通过以下生产验收。每项保留请求、响应、数据库记录及页面证据，金额样例核验全部中间值。</p><div class="prd-table-scroll"><table><thead><tr><th>编号 / 项目</th><th>操作或前提</th><th>预期结果</th></tr></thead><tbody><tr><td>AC-01 默认配置搜索</td><td>进入账单配置</td><td>厅主与站点均全部，3 个演示站点可见；查询后显示准确数量。</td></tr><tr><td>AC-02 厅主站点联动</td><td>选厅主 A 后选 763，再改厅主 B</td><td>763 清除为全部，选项仅含 B 所属站点；查询显示 768。</td></tr><tr><td>AC-03 配置编辑保持筛选</td><td>筛选 763，编辑保存或打开版本记录</td><td>返回列表仍为 763，其他站点配置不变。</td></tr><tr><td>AC-04 输入校验</td><td>比例 −1/101、金额负数、超精度、原因空白、D&gt;E</td><td>分别拒绝，无无效配置或版本产生。</td></tr><tr><td>AC-05 适用配置</td><td>保存未来月份配置后重算此前草稿</td><td>此前月份仍用其适用配置；未来版本不误标旧期失效。</td></tr><tr><td>AC-06 下发后配置保护</td><td>生效月≤本站最近已下发月</td><td>拒绝保存，历史账单不变。</td></tr><tr><td>AC-07 汇率前置</td><td>未确认月度汇率直接计算</td><td>前端禁用且接口拒绝，不取旧值兜底。</td></tr><tr><td>AC-08 确认不生成</td><td>确认 10 月 R=5.43</td><td>只产生月度确认记录，无新增账单。</td></tr><tr><td>AC-09 全站批量范围</td><td>账单或配置列表筛选单站点后计算</td><td>弹窗固定所有、禁用；仍计算完整站点集合，不受筛选影响。</td></tr><tr><td>AC-10 首轮生成</td><td>演示初始四份 6–9 月已结清单；确认 10 月汇率后计算</td><td>新增 762/763/768 三份 10 月草稿；历史不变，站点端不见草稿。</td></tr><tr><td>AC-11 独立计费</td><td>763 维护费改为 4,000，其余默认；R=5.43</td><td>763 应付 12,241.56，762/768 各 11,241.56。</td></tr><tr><td>AC-12 批量失败原子性</td><td>其中一站无配置、数据缺失或账户无效</td><td>整批不发布新单，列明失败站点，已有单不变。</td></tr><tr><td>AC-13 草稿重算</td><td>未勾选替换 / 勾选替换后提交</td><td>前者拒绝；后者版本 +1，编号不变，历史版本可查，不重复扣额度。</td></tr><tr><td>AC-14 已下发跳过</td><td>三单中一份已下发，再重算</td><td>保留该单全部快照，其余待下发单重算；全已下发则计算禁用。</td></tr><tr><td>AC-15 窗口版本变化</td><td>弹窗打开后变更汇率 / 配置 / 统计 / 额度版本</td><td>提交被拒绝，要求刷新；不能沿用旧预览保存。</td></tr><tr><td>AC-16 汇率更新</td><td>未下发时 R 改为 10</td><td>旧草稿金额暂不变但禁下发；重算后默认 F=8,000，T=524.83。</td></tr><tr><td>AC-17 汇率锁定</td><td>任一正应付或零应付单下发后修改 R</td><td>整月修改被拒绝，其余草稿仍可使用锁定 R 重算。</td></tr><tr><td>AC-18 并发确认与下发</td><td>同时修改月度汇率与下发旧草稿</td><td>仅与锁定 / 版本条件一致的操作成功，无已下发旧汇率与新确认混用。</td></tr><tr><td>AC-19 正常下发</td><td>核对勾选、有效账户、版本一致、备注合法</td><td>状态待结清，站点立即可见；金额 / 明细 / 汇率 / 备注两端一致。</td></tr><tr><td>AC-20 下发重复 / 超时</td><td>重复请求相同账单下发</td><td>只一份下发及一次额度消耗，未知结果可按请求 ID 查询。</td></tr><tr><td>AC-21 正应付结清</td><td>H=F、凭证合法、到账确认勾选</td><td>一次性已结清，站点展示相同凭证与登记信息。</td></tr><tr><td>AC-22 结清失败</td><td>H&lt;F / H&gt;F / 缺凭证 / 未勾选 / 凭证已用于他单</td><td>拒绝结清，原单待结清状态不变。</td></tr><tr><td>AC-23 零应付</td><td>草稿 F=0，无付款凭证，核对后下发</td><td>下发事务内已结清，实收 0，方式 zero_auto；无凭证错误。草稿不提前结清。</td></tr><tr><td>AC-24 零应付失败</td><td>零应付下发写入失败</td><td>仍为草稿，不产生已结清记录、不扣额度、不对站点可见。</td></tr><tr><td>AC-25 汇总表精度基准</td><td>执行 EX-10；另提供不符合汇总表约定精度或缺少 GGR 的数据</td><td>前者按汇总表最终值计算抽成 0.02；后者阻止计算并由数据中心修复，月结不自行取舍或回溯原始注单兜底。</td></tr><tr><td>AC-26 汇总和归零</td><td>执行 EX-02、EX-03、EX-04</td><td>分别抽成 2、10、10 BRL，计费项内净额与跨项隔离正确。</td></tr><tr><td>AC-27 低消抵扣顺序</td><td>执行 EX-07、EX-08、EX-09</td><td>中间值及余额与样例一致，抵扣可使应付低于低消并为 0。</td></tr><tr><td>AC-28 开版应收与额度</td><td>配置 O 并生成 / 下发 / 收款</td><td>E 不自动增长；批准人工新增额度只计一次并可查来源。</td></tr><tr><td>AC-29 人工开版结转</td><td>上期期末 3,000，新增 1,000，减少 200</td><td>经核对本期期初 3,800；未核对不得生成有余额站点账单。</td></tr><tr><td>AC-30 其他抵扣未用</td><td>X=500，本期 X′=0</td><td>保留来源余额 500；下月未人工分配不自动使用，分配后按来源消耗。</td></tr><tr><td>AC-31 额度过期与并发</td><td>来源到期或被其他期消耗后下发旧草稿</td><td>拒绝，提示余额 / 版本变化；不出现负余额或重复使用。</td></tr><tr><td>AC-32 收款账户版本</td><td>运营联系开发完成本站生产收款配置变更后，下发旧草稿 / 查看历史已下发单</td><td>旧草稿需重算；历史单仍为原快照地址和版本。</td></tr><tr><td>AC-33 站点隔离</td><td>站点 A 查询 B、草稿、内部依据或日志</td><td>列表、详情、导出和接口全部拒绝越权，不泄露计数。</td></tr><tr><td>AC-34 业务权限</td><td>配置人员确认汇率 / 结清，受限财务发起全站计算</td><td>均被后端拒绝，失败审计记录存在。</td></tr><tr><td>AC-35 操作日志搜索</td><td>从单站点筛选页进入操作记录</td><td>两个条件固定所有且禁用；全部授权范围记录可见，包含跨站点事件。</td></tr><tr><td>AC-36 封账与空数据</td><td>源接口超时 / 空响应 / 明确零流水已封账</td><td>前两项阻止；最后一项按 0 统计并正常计维护费及低消。</td></tr><tr><td>AC-37 取消退款</td><td>同账期正常结算后全退 / 部分退并在封账前更新</td><td>按最终有效版本移除或修正，退款不重复计入派彩。</td></tr><tr><td>AC-38 跨月结算与迟到</td><td>9 月下注 10 月首次结算；11 月收到首次结算时间为 10 月的记录</td><td>归属 10 月；封账后不直接并入，按异常重开或更正流程处理。</td></tr><tr><td>AC-39 已下发重结算</td><td>下发后供应商更正原注单</td><td>原单金额不变，进入关联原单的异常记录，不能当新单整笔计入下月。</td></tr><tr><td>AC-40 优惠与免费游戏</td><td>主钱包优惠投注 / 实际扣款 0 的可兑换免费旋转 / 纯试玩</td><td>前者正常统计；免费旋转 W=0、Q=实际返还；纯试玩整组排除。</td></tr><tr><td>AC-41 统计与导出</td><td>筛选跨月多状态并翻页、导出</td><td>统计公式正确，导出覆盖全结果并按各单历史汇率；不得只导当前页。</td></tr><tr><td>AC-42 汇总表与导出一致</td><td>底层取舍前合计 0.015，汇总表已输出 0.02；查询账单及导出</td><td>月结输入、快照、页面及导出统计字段均使用汇总表最终 0.02，不额外导出原始高精度值作为月结计算依据。</td></tr><tr><td>AC-43 金额尾差</td><td>执行 EX-05、EX-06 与零应付</td><td>双币合计按公式，尾差不计入应付；零应付 BRL 也为 0。</td></tr><tr><td>AC-44 日志与失败回退</td><td>配置、汇率、计算、下发、结清写入失败</td><td>业务回滚，失败日志保留请求和原因，不出现虚假成功状态。</td></tr><tr><td>AC-45 通知边界</td><td>正常下发</td><td>站点可见，无邮件 / 站内信任务，不把通知当作已付款。</td></tr><tr><td>AC-46 月末边界</td><td>UTC−03:00 月末最后一刻、次月 1 日 00:00:00、跨年</td><td>左闭右开，边界不重复；未结束月份不可计算。</td></tr><tr><td>AC-47 持久化与刷新</td><td>服务重启、刷新、重新登录后查询</td><td>单据、快照、历史版本、额度、凭证与日志保留，不依赖浏览器本地存储。</td></tr><tr><td>AC-48 原型演示重置</td><td>HTML 演示完成后点击重置</td><td>只恢复演示四份历史单；生产环境无重置按钮或重置业务接口。</td></tr><tr><td>AC-49 收款配置隐私与站点绑定</td><td>同地区 A/B 使用不同生产收款配置；运营联系开发变更 A；业务账号尝试修改配置</td><td>A/B 仅读取各自配置，不按地区兜底；A 草稿需重算、B 不受影响；已下发 A 快照不变。总控财务、配置人员、站点人员均无业务后台收款配置写入入口或接口权限。缺少本站配置则阻止计算 / 下发，不暴露其他站点地址。</td></tr><tr><td>AC-50 权限及 PRD 入口</td><td>按现有角色分配操作权限和站点范围，访问生产站点后台</td><td>所有查询、导出及写操作由后端验证动作与范围；合并原型角色不等于生产全权账号。正式站点后台无 PRD 菜单、按钮及对应内容路由，原型保留评审入口。</td></tr><tr><td>AC-51 GGR 取舍顺序一致</td><td>汇总表投注显示 100.00、派彩显示 100.00，按汇总表既有“先算 GGR 再取舍”规则产生最终 GGR=0.01；输入同版本合法结果，抽成比例 100%</td><td>月结采用汇总表 GGR=0.01，抽成为 0.01，不用展示值相减得到的 0.00 覆盖 GGR。接口保留同一汇总版本、精度和规则标识，能够解释尾差；不符合汇总规则的差异仍作为数据异常阻止计算。</td></tr></tbody></table></div></section>
<section id="prd-16" class="prd-section"><div class="prd-sectionhead"><span>16</span><h2>实施交付与版本说明</h2></div><div class="prd-table-scroll"><table><thead><tr><th>交付项</th><th>完成标准</th></tr></thead><tbody><tr><td>前端</td><td>两端列表、筛选、分页、配置、汇率、批量计算、单笔下发、结清、收款快照只读展示、额度核对、日志、导出打印和错误提示完成联调；不可仅靠禁用按钮保证权限。</td></tr><tr><td>后端</td><td>版本快照、状态机、精确金额、封账校验、完整站点范围、权限隔离、事务 / 幂等、额度台账与凭证唯一性全部落地。</td></tr><tr><td>数据接入</td><td>每个供应商完成投注 / 派彩 / 有效投注 / 优惠类型映射、取消退款与重结算样本验证、汇总表字段精度及取舍规则同步和封账对账；异常数据不会自动按 0 入账。</td></tr><tr><td>业务与生产初始化</td><td>财务准备月度汇率确认单、期初额度及来源；配置人员维护计费规则；运营联系开发完成各 site_id 的生产收款信息配置与核验并留存版本。原型占位值不得迁入生产。</td></tr><tr><td>测试出口</td><td>第 15 节用例执行完成；差异闭环；无影响金额、越权、重复下发 / 消耗、快照改写和状态一致性的遗留缺陷。</td></tr><tr><td>运维及运营</td><td>手动月结操作流程、计算任务失败排查、账单超时查询、财务异常台账和恢复流程可执行；生产不开放演示切换与重置功能。</td></tr></tbody></table></div><p>V2.2（2026-11-28）：月结统计输入以汇总表已产生并完成取舍的最终小数结果为准；同步字段精度、GGR 口径、快照、导出、样例及验收；不另外指定源数据存储精度、不回溯原始明细重新取舍。V2.1（2026-11-28）：收款信息改为运营联系开发按站点配置生产数据；移除业务后台收款维护页面及写权限，保留版本、快照及下发校验；明确现有角色按功能和站点授权，正式站点后台不保留 PRD 入口。V2.0（2026-11-28）：统一一期范围和正式产品规则，明确全站批量计算与单笔下发、负盈利不跨项跨月抵扣、低消和抵扣顺序、人工汇率确认单、收款快照、零应付自动结清、人工额度结转、数据异常归属、精确十进制计算、权限及验收；其中统计输入精度规则由 V2.2 的汇总表口径覆盖。替换原文中未形成执行规则的描述。</p><p>原型保留现有演示业务逻辑，本文为开发交付基线；本次文档更新不宣称所有正式功能已在 HTML 中实现。未展示具体内容的截图不能形成验收规则，验收以本文明确字段、公式和行为为准。</p></section>

<script>
const KEY='ddgg-billing-october-demo-v1';const DEMO_MONTH='2026-10';const DEMO_SCENARIO='history-through-2026-09';const $=id=>document.getElementById(id);const money=n=>Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});const round=n=>Math.round((n+Number.EPSILON)*100)/100;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const copy=o=>JSON.parse(JSON.stringify(o));const now=()=>new Date().toLocaleString('sv-SE',{timeZone:'Asia/Shanghai'})+' 北京时间';
const seedRows=[{name:'PG',type:'电子',nature:'自研',base:'游戏盈利',rate:5.5,profit:488647.32,bet:11087847.25,valid:11087847.25},{name:'PP',type:'电子',nature:'第三方',base:'游戏盈利',rate:5,profit:180000,bet:4250000,valid:4200000},{name:'Evolution',type:'视讯',nature:'第三方',base:'游戏盈利',rate:10,profit:88760.8,bet:2318000,valid:2318000},{name:'自研体育',type:'体育',nature:'自研',base:'游戏盈利',rate:8,profit:-12500,bet:1280000,valid:1210000}];
function baseConfig(site='762'){return {site,version:2,effective:'2026-10',maintenance:3000,minimum:5000,opening:0,creditBalance:0,monthlyCredit:0,other:0,fx:5.43,rows:copy(seedRows),reason:'初始化演示配置',updated:'2026-10-01 00:00:00',payAccount:'演示收款账户 · USDT / TRC20',contact:'商务联系人（演示）'}}
function calculate(c){const lines=c.rows.map(r=>({...r,amount:round(Math.max(0,r.base==='游戏盈利'?r.profit:r.valid)*r.rate/100)}));const commission=round(lines.reduce((s,r)=>s+r.amount,0));const converted=round(commission/c.fx);const topup=round(Math.max(0,c.minimum-converted));const before=round(converted+topup+c.maintenance+c.opening);const openingCredit=round(Math.min(c.monthlyCredit,c.creditBalance,before));const otherCredit=round(Math.min(c.other,Math.max(0,before-openingCredit)));return {lines,commission,converted,topup,openingCredit,otherCredit,remaining:round(c.creditBalance-openingCredit),total:round(before-openingCredit-otherCredit),brl:round(commission+(topup+c.maintenance+c.opening-openingCredit-otherCredit)*c.fx)}}

function saveConfig(){if(role!=='master')return;let old=state.configs[activeConfig],c=copy(old),fields=['maintenance','minimum','opening','creditBalance','monthlyCredit','other'];for(let f of fields){if(!numeric($(f).value,f==='fx'?4:2))return err(f==='fx'?'汇率须为有效非负数字，最多 4 位小数。':'费用须为有效非负金额，最多 2 位小数。');c[f]=Number($(f).value)}if(c.monthlyCredit>c.creditBalance)return err('本月计划抵扣不能超过期初剩余可抵扣开版费。');for(let i=0;i<c.rows.length;i++){let v=$('rate'+i).value,base=$('base'+i).value;if(!numeric(v,2)||Number(v)>100)return err('抽成比例须在 0%–100% 之间，最多 2 位小数。');if(!['游戏盈利','有效投注'].includes(base))return err('请选择有效的抽成方式。');c.rows[i].rate=Number(v);c.rows[i].base=base}c.effective=$('effective').value;if(!validMonth(c.effective))return err('请选择有效的生效账期。');let last=state.bills.filter(b=>b.site===c.site&&b.status!=='draft').map(b=>b.month).sort().pop();if(last&&c.effective<=last)return err(`站点已下发至 ${last}，新配置须从后续账期生效。`);c.reason=$('configReason').value.trim();if(!c.reason||c.reason.length>200)return err('修改原因须为 1–200 个字符。');ensureConfigHistory();c.version=Math.max(...state.configVersions[c.site].map(v=>v.version))+1;c.updated=now();if(!commitChange(()=>{state.configs[activeConfig]=c;state.configVersions[c.site].push(copy(c))},{site:c.site,action:'修改账单配置',detail:`V${old.version} → V${c.version}，生效 ${c.effective}；${c.reason}`}))return;closeModal();render();toast('新版本已保存，历史配置保留；适用草稿需重新生成')}

function generate(){if(role!=='master')return;const m=$('genMonth').value;if(!validMonth(m)||m>=brazilMonth())return err('请选择巴西时间已结束的账期。');const r=monthlyRate(m);if(!r)return err('本期汇率尚未确认，请先设置月度汇率。');const scope=billingScope(m),pending=scope.filter(x=>!x.existing||x.existing.status==='draft'),ctx=generationContext;if(!ctx||ctx.month!==m||ctx.stamp!==batchStamp(m,scope))return err('汇率、站点配置或账单状态已变化，请重新打开窗口核对。');if(!pending.length)return err('本期全部站点账单均已下发，无需再次计算。');if(pending.some(x=>x.existing)&&!$('replaceDraft').checked)return err('本期已有草稿，请勾选确认替换全部未下发草稿。');const problems=[],prepared=[];for(const x of pending){const {site,config:c,existing}=x;if(!c){problems.push(`站点 ${site} 缺少适用配置`);continue}const previous=state.bills.filter(b=>b.site===site&&b.month<m&&b.status!=='draft').sort((a,b)=>b.month.localeCompare(a.month))[0];if(m!==c.effective&&(c.creditBalance>0||(previous&&previous.values.remaining>0))){problems.push(`站点 ${site} 需为本期核对抵扣余额并保存配置`);continue}const effective=copy(c);effective.fx=r.fx;if(m!==c.effective){effective.opening=0;effective.monthlyCredit=0;effective.other=0}const b=bill(effective,m);b.configSnapshot=copy(c);b.monthlyRateVersion=r.version;b.fxMeta={source:'月度结算汇率',time:r.time,actor:r.actor,version:r.version};b.revisions=existing?[...(existing.revisions||[]),billRevision(existing,'批量重新计算')]:[];if(existing)b.version=existing.version+1;if(!Number.isFinite(b.values.total)||b.values.total<0){problems.push(`站点 ${site} 账单计算异常`);continue}prepared.push(b)}if(problems.length)return err('本次未保存任何账单：'+problems.join('；'));const ids=new Set(prepared.map(b=>b.id));if(!commitChange(()=>{state.bills=state.bills.filter(b=>!ids.has(b.id));state.bills.push(...prepared)},{site:'全部站点',action:'批量计算月结账单',detail:`${m} · 范围：所有厅主 / 所有站点 · 新增 ${pending.filter(x=>!x.existing).length} 份，重新计算 ${pending.filter(x=>x.existing).length} 份，保留已下发 ${scope.length-pending.length} 份 · 汇率 V${r.version} / ${r.fx} BRL/USDT · ${prepared.map(b=>b.site+':V'+b.version+' '+money(b.values.total)+' USDT').join('；')}`}))return;closeModal();filter={owner:'all',site:'all',status:'all',month:m};page='bills';render();batchResult(m,prepared.map(b=>b.id));toast(`本期 ${prepared.length} 份账单计算完成，请逐份核对后下发`)}
function getBill(id){return state.bills.find(b=>b.id===id)}function detail(id){let b=getBill(id);if(!canView(b))return;let c=b.snapshot,v=b.values;modal(`账单详情 · ${b.month} / ${role==='master'?'站点名称':'商户'} ${b.site}`,`${role==='master'?identityFields(b.site):''}<div class="timeline"><div class="${b.status==='draft'&&!monthlyRate(b.month)?'':'done'}"><b>01 确认汇率</b>${b.status==='draft'&&!monthlyRate(b.month)?'待确认本期汇率':(b.fxMeta?.version?'汇率 V'+b.fxMeta.version:'历史账单快照')+' · '+b.snapshot.fx}</div><div class="done"><b>02 计算账单</b>${b.generated} · V${b.version}</div><div class="${b.status!=='draft'?'done':''}"><b>03 下发至站点</b>${b.sent?esc(b.sent):'等待总控核对下发'}</div><div class="${b.status==='paid'?'done':''}"><b>04 登记结清</b>${b.settled?esc(b.settled):'等待到账确认'}</div></div>${b.note?`<div class="notice">下发备注：${esc(b.note)}</div>`:''}<div class="split"><div class="summarybox"><div class="rowflex" style="justify-content:space-between"><span class="muted small">账单应付总额</span>${status(b)}</div><div class="amount num" style="margin-top:10px">${money(v.total)} <small>USDT</small></div><div class="small muted num" style="margin-top:5px">≈ ${money(v.brl)} BRL　｜　1 USDT = ${c.fx} BRL</div><div class="dlist"><div><span>账单编号</span><b>${b.id}</b></div><div><span>配置版本</span><b>V${c.version}</b></div><div><span>汇率来源</span><b>${esc(b.fxMeta?.source||'配置快照')}</b></div><div><span>汇率确认时间</span><b>${esc(b.fxMeta?.time||b.created)}</b></div><div><span>维护费用</span><b>${money(c.maintenance)}</b></div><div><span>开版费用</span><b>${money(c.opening)}</b></div><div><span>抽成费用折合</span><b>${money(v.converted)}</b></div><div><span>月报表低消</span><b>${money(c.minimum)}</b></div><div><span>需补交低消</span><b>${money(v.topup)}</b></div><div><span>本月抵扣开版费</span><b>−${money(v.openingCredit)}</b></div><div><span>其他抵扣</span><b>−${money(v.otherCredit)}</b></div><div><span>剩余可抵扣开版费</span><b>${money(v.remaining)}</b></div></div><div class="calc">合计 = 抽成折合 + 低消补差 + 维护费 + 开版费 − 本月开版抵扣 − 其他抵扣<br>低消补差 = max（月报表低消 − 抽成折合，0）<br><span cla function renderRules(){$('content').innerHTML=header('规则说明','一期核心规则，完整开发与测试要求见 PRD V2.2。',role==='master'?`<button class="danger" onclick="resetDemoModal()">重置演示数据</button>`:'')+`<div class="notice orange">这是根据现有站点页面推导的产品原型，不连接真实后台，也不会实际下发账单或收付款。预置账单使用 2026 年示例数据，新生成账单按当前巴西时间校验账期。</div><div class="helpgrid"><div class="helpblock"><h3>01 · 已从现有页面确认</h3><p>账单列表包含开版费、剩余可抵扣开版费、本月抵扣、其他抵扣、维护费、抽成账单、低消补差、月报表低消与双币合计。</p><p>账单明细按平台、游戏类型、游戏性质、结算输赢、投注金额、有效投注、抽成方式及比例展示。</p><p>11 月 1 日生成的是 10 月账期。示例汇率 5.43，维护费 3,000 USDT，低消 5,000 USDT，PG 按盈利 5.5% 抽成。</p></div><div class="helpblock"><h3>02 · 总控与站点职责</h3><p><b>总控：</b>按商户编辑比例和费用 → 确认月度汇率 → 计算账单 → 核对 → 下发站点 → 到账后登记结清。</p><p><b>站点：</b>仅查看本商户已下发账单、查看费用和抽成明细、导出及打印。不可编辑比例或修改金额。</p><p>页面顶部可切换两端，状态即时联动。生产系统须在服务端实施权限隔离。</p></div><div class="helpblock"><h3>03 · 计算口径</h3><p>单平台抽成 = max（计费基数，0）× 抽成比例。基数可选游戏盈利（GGR/公司输赢）或有效投注；游戏盈利 = 投注额 − 派彩（含本金）。仅按盈利抽成时负盈利基数归零，不跨平台抵亏、不结转亏损。</p><p>抽成 USDT = 平台抽成 BRL 合计 ÷ 结算汇率。低消补差 = max（低消 − 抽成 USDT，0），维护费不计入低消。</p><p>应付 = 抽成 + 低消补差 + 维护费 + 开版费 − 开版抵扣 − 其他抵扣。抵扣不得造成负应付，剩余开版抵扣额随账单展示。</p><p>每平台先保留 2 位，再汇总换汇并四舍五入。开版费和本月抵扣为单期配置，一期采用人工核对结转，有余额时须为当期核对余额并保存配置，不自动结转。</p></div><div class="helpblock"><h3>04 · 数据与边界</h3><p>保留原页面的 PG 示例与本期合计 44,751.68 BRL / 11,241.56 USDT；其余平台、历史账单与商户均为补充演示数据。</p><p>比例保存留痕，草稿重算版本递增；已下发账单保持快照，不可直接覆盖。正式更正按 PRD 第 12 节人工异常流程处理，原单不改写。</p><p>原型数据保存在当前浏览器；两个入口模拟角色切换，不代表真实登录权限。收款地址为占位，不可用于付款。</p><p>正式交付按 PRD V2.2 实现，包括零应付下发后自动结清、账户快照、额度台账和精确十进制计算；本 HTML 的模拟业务不代表已完成全部正式功能。</p></div></div>`}

function brazilMonth(){return new Date(Date.now()-3*3600000).toISOString().slice(0,7)}
function nextMonth(m){const [y,n]=m.split('-').map(Number);return new Date(Date.UTC(y,n,1)).toISOString().slice(0,7)}
function previousMonth(m){const [y,n]=m.split('-').map(Number);return new Date(Date.UTC(y,n-2,1)).toISOString().slice(0,7)}
function validMonth(m){return /^\d{4}-(0[1-9]|1[0-2])$/.test(m)}
function numeric(value,places=2){const t=String(value??'').trim();return new RegExp('^\\d{1,12}(?:\\.\\d{1,'+places+'})?$').test(t)&&Number.isFinite(Number(t))}
function ensureConfigHistory(){state.configVersions??={};for(const site of Object.keys(state.configs)){const versions=new Map((state.configVersions[site]||[]).map(c=>[c.version,c]));for(const b of state.bills.filter(b=>b.site===site)){if(!versions.has(b.snapshot.version))versions.set(b.snapshot.version,copy(b.configSnapshot||b.snapshot))}const c=state.configs[site];versions.set(c.version,copy(c));state.configVersions[site]=[...versions.values()];}}
function configFor(site,month){ensureConfigHistory();return (state.configVersions[site]||[]).filter(c=>c.effective<=month).sort((a,b)=>b.effective.localeCompare(a.effective)||b.version-a.version)[0]||null}
function draftStale(b){const c=configFor(b.site,b.month),r=monthlyRate(b.month);return !c||c.version!==b.snapshot.version||!r||b.monthlyRateVersion!==r.version||b.snapshot.fx!==r.fx}

function monthlyStatusBar(){const m=DEMO_MONTH,r=monthlyRate(m),current=state.bills.filter(b=>b.month===m),paid=current.filter(b=>b.status==='paid').length,sent=current.filter(b=>b.status==='sent').length,draft=current.filter(b=>b.status==='draft').length;return `<div class="panel" style="padding:18px 20px;margin-bottom:20px"><div class="notice">演示起点：历史账单截至 <b>2026-09</b>，均已结清。本轮从“开始月结”生成 <b>2026-10</b> 账单，再下发和登记结清。<br><span class="small">${current.length?`本轮已计算 ${current.length} 份 · 待下发 ${draft} · 待结清 ${sent} · 已结清 ${paid}`:'10 月尚无账单，等待开始月结。'}</span></div>${flowSteps(current.length?3:r?2:1)}<div class="rowflex" style="justify-content:space-between;flex-wrap:wrap;gap:12px"><div><b>${m} 月度结算汇率</b>　<span class="badge">${r?rateLocked(m)?'已确认 · 已锁定':'已确认 · 可计算':'待确认 · 暂不可计算'}</span><p class="small muted">${r?`1 USDT = ${r.fx} BRL · 汇率 V${r.version} · 巴西全部站点本期统一使用`:'请通过“开始月结”填写并确认 10 月汇率。演示可填写 5.43。'}</p></div><div class="actions">${r?`<button onclick="monthlyRateModal('${m}')">查看本期汇率</button>`:''}<button onclick="resetDemoModal()">重置本轮演示</button></div></div></div>`}
function monthlyRateModal(month,site){if(role!=='master')return;month=month||DEMO_MONTH;site=site||(state.configs[$('fsite')?.value]?$('fsite').value:['762','763','768'].find(id=>!$('fowner')?.value||$('fowner').value==='all'||siteMeta(id).ownerId===$('fowner').value)||'762');rateContext={site,month};modal('月度结算汇率 · 计算前确认',`${flowSteps(1)}<div class="notice">适用范围：巴西全部站点 · 所选账期 · BRL / USDT。先保存并确认汇率，再计算各站点账单；每个新账期需要重新确认。</div><div class="formgrid">${inputField('结算账期 *','monthlyMonth',month,'month','onchange="refreshMonthlyRate()"')}<div class="field"><label>汇率方向</label><input value="1 USDT = R BRL" disabled></div></div><div id="monthlyRateInfo"></div><div class="formgrid" style="margin-top:18px">${inputField('本月核定汇率 R *','monthlyFx','','number','min="0.0001" step="0.0001" placeholder="请输入本月汇率"')}</div><div class="field"><label>汇率依据 / 修改原因 *（仅总控可见）</label><textarea id="monthlyReason" maxlength="200" placeholder="例如：财务确认的本月结算汇率及取价依据"></textarea></div><div class="small muted" style="margin-top:14px">确认仅保存本期汇率，不计算或下发账单。修改会使本期已有草稿需重新计算；已有下发账单时，本期汇率锁定。</div>`,`<button onclick="closeModal()">取消</button><button id="monthlyNext" onclick="generateModal(rateContext.site,$('monthlyMonth').value)">下一步：计算账单</button><button id="confirmMonthlyRate" class="primary" onclick="confirmMonthlyRate()">确认本月汇率</button>`,'wide');refreshMonthlyRate()}
function refreshMonthlyRate(){if(role!=='master'||!rateContext)return;const m=$('monthlyMonth').value,r=monthlyRate(m),issued=state.bills.filter(b=>b.month===m&&b.status!=='draft'),rates=[...new Set(issued.map(b=>b.snapshot.fx))],locked=!!issued.length;rateContext.month=m;rateContext.before=JSON.stringify(r);$('monthlyFx').value=r?r.fx:rates.length===1?rates[0]:'';$('monthlyFx').disabled=locked;$('monthlyReason').value='';$('monthlyReason').disabled=locked&&!!r;$('monthlyNext').disabled=!r||!validMonth(m)||m>=brazilMonth();$('confirmMonthlyRate').disabled=!!(r&&locked)||rates.length>1||!validMonth(m)||m>=brazilMonth();$('monthlyRateInfo').innerHTML=`<div class="notice ${r?'':'orange'}">${r?`本期已确认：<b>1 USDT = ${r.fx} BRL</b> · V${r.version}<br>${esc(r.actor)} · ${esc(r.time)}<br>汇率依据：${esc(r.reason)}`:'本期尚未确认；确认前不能计算新账单。'}${locked?'<p>该账期已有下发账单，汇率不可修改。</p>':''}${!r&&rates.length===1?'<p>历史账单使用上方汇率；请核对依据并确认同值后，继续计算本期其他站点账单。</p>':''}${rates.length>1?'<p class="danger">历史已下发账单存在不同汇率，不能自动统一。请选择新账期；历史差异须另行对账处理。</p>':''}${r&&!locked?'<p>如需调整，请填写新汇率与原因。本期所有待下发账单须按新版本重新计算。</p>':''}</div>`;$('error').style.display='none'}
function confirmMonthlyRate(){if(role!=='master'||!rateContext)return;const m=$('monthlyMonth').value,raw=$('monthlyFx').value,reason=$('monthlyReason').value.trim(),old=monthlyRate(m);if(!validMonth(m)||m>=brazilMonth())return err('请选择巴西时间已结束的结算账期。');if(rateContext.month!==m||rateContext.before!==JSON.stringify(old))return err('账期或汇率已变化，请重新打开窗口核对。');if(!numeric(raw,4)||Number(raw)<=0)return err('汇率必须大于 0，最多 4 位小数。');const fx=Number(raw),issued=state.bills.filter(b=>b.month===m&&b.status!=='draft');if(old&&issued.length)return err('本期已有下发账单，汇率已锁定。');if(issued.some(b=>b.snapshot.fx!==fx))return err('本期已有下发账单，只能确认与其快照相同的汇率。');if(old&&old.fx===fx)return err('本期已确认该汇率，可直接进入下一步计算账单。');if(!reason||reason.length>200)return err('请填写 1–200 字符的汇率依据 / 修改原因。');const r={month:m,region:'巴西',pair:'BRL/USDT',fx,version:(old?.version||0)+1,time:now(),actor:'总控管理员',reason};const site=rateContext.site;if(!commitChange(()=>{state.monthlyRates??={};state.monthlyRateHistory??=[];if(old)state.monthlyRateHistory.push(copy(old));state.monthlyRates[m]=r;},{site:'全部站点',action:'确认月度结算汇率',detail:`巴西 · ${m} · 汇率 V${r.version} · ${old?old.fx+' → ':''}${fx} BRL/USDT · ${reason}`}))return;closeModal();filter.month=m;page='bills';render();modal('本月汇率已确认',`${flowSteps(1)}<div class="summarybox"><div class="small muted">${m} · 巴西全部站点 · 汇率 V${r.version}</div><div class="amount" style="margin:16px 0">1 USDT = ${fx} BRL</div><p>汇率已保存，尚未计算账单。</p><p class="small muted">下一步统一计算所有厅主和所有站点的账单，核对结果后再逐份下发。${old?'本期已有草稿须按新汇率版本重新计算。':''}</p></div>`,`<button onclick="closeModal()">稍后计算</button><button class="primary" onclick="generateModal('${site}','${m}')">下一步：计算账单</button>`,'wide')}


function billingScope(month){return ['762','763','768'].map(site=>({site,config:state.configs[site]&&validMonth(month)?configFor(site,month):null,existing:state.bills.find(b=>b.site===site&&b.month===month)||null}))}
function batchStamp(month,scope){return JSON.stringify({month,rate:monthlyRate(month),scope:scope||billingScope(month)})}
function batchResult(month,changed){if(role!=='master')return;const rows=state.bills.filter(b=>b.month===month).sort((a,b)=>a.site.localeCompare(b.site));modal('本期账单计算完成',`${flowSteps(3)}<div class="notice">${month} · 厅主：所有 · 站点名称：所有<br>本次计算 ${changed.length} 份，保留已下发 / 已结清 ${rows.length-changed.length} 份。新计算账单均为待下发，请逐份核对金额和明细后下发。</div><div class="tablewrap"><table><thead><tr><th>厅主名称</th><th>站点名称</th><th>账单版本</th><th>应付金额（USDT）</th><th>状态</th><th>操作</th></tr></thead><tbody>${rows.map(b=>`<tr><td>${siteMeta(b.site).ownerName}</td><td>${siteMeta(b.site).siteName}</td><td>V${b.version}</td><td>${money(b.values.total)}</td><td>${status(b)}</td><td><button class="textbtn" onclick="detail('${b.id}')">核对详情</button></td></tr>`).join('')}</tbody></table></div>`,`<button class="primary" onclick="closeModal()">查看本期账单列表</button>`,'wide')}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render();
</script></body></html>
