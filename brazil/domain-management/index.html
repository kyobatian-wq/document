<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>巴西站 - 域名管理需求目录</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #667085;
      --line: #e5e7ef;
      --blue: #1266d6;
      --blue-soft: #eaf2ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .wrap { max-width: 1040px; margin: 0 auto; padding: 48px 24px; }
    header { margin-bottom: 24px; }
    .eyebrow { color: var(--blue); font-weight: 700; margin-bottom: 8px; }
    h1 { margin: 0 0 12px; font-size: 34px; line-height: 1.2; letter-spacing: 0; }
    .summary { max-width: 760px; color: var(--muted); font-size: 16px; margin: 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-top: 28px; }
    .card {
      display: block;
      min-height: 150px;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      text-decoration: none;
      color: inherit;
      transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    }
    .card:hover { transform: translateY(-2px); border-color: #b7cff4; box-shadow: 0 12px 28px rgba(21, 35, 70, .08); }
    .tag { display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 999px; color: var(--blue); background: var(--blue-soft); font-weight: 700; font-size: 12px; margin-bottom: 16px; }
    h2 { margin: 0 0 8px; font-size: 18px; line-height: 1.3; letter-spacing: 0; }
    .card p { margin: 0; color: var(--muted); }
    .note { margin-top: 28px; padding: 16px 18px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--muted); }
    footer { margin-top: 28px; color: #98a2b3; font-size: 13px; }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="eyebrow">系统管理 / 域名管理</div>
      <h1>域名管理需求目录</h1>
      <p class="summary">用于集中管理巴西站域名管理模块的迭代需求页、PRD 要点和交互原型。</p>
    </header>

    <section class="grid" aria-label="域名管理迭代需求">
      <a class="card" href="./detail-edit-iteration.html">
        <span class="tag">迭代需求</span>
        <h2>详情修改能力补充</h2>
        <p>列表详情按钮、主域名只读、推广域名跳转配置、防封页模板与落地主域名多选、解析值只读规则。</p>
      </a>
    </section>

    <div class="note">后续域名管理相关迭代需求页继续追加到此目录，不直接覆盖模块默认入口。</div>
    <footer>Updated: 2026-08-18</footer>
  </main>
</body>
</html>
