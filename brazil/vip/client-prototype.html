<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VIP Client Prototype</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #f5f7fb;
      color: #172033;
      font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .page-head {
      max-width: 1040px;
      margin: 0 auto;
      padding: 28px 24px 8px;
    }
    .back {
      color: #1266d6;
      text-decoration: none;
      font-weight: 700;
    }
    .stage {
      min-height: calc(100vh - 64px);
      display: grid;
      align-items: start;
      justify-items: center;
      padding: 12px 12px 40px;
    }
    .error {
      max-width: 720px;
      margin: 48px auto;
      padding: 18px 20px;
      border: 1px solid #e5e7ef;
      border-radius: 8px;
      background: #fff;
      color: #667085;
    }
  </style>
</head>
<body>
  <header class="page-head">
    <a class="back" href="./">返回 VIP 模块</a>
  </header>
  <main class="stage" id="prototype-root" aria-live="polite"></main>
  <script>
    async function loadPrototype() {
      const root = document.getElementById("prototype-root");
      try {
        const response = await fetch("./assets/vip-br-prototype.fragment.html");
        if (!response.ok) throw new Error("Prototype file not found");
        root.innerHTML = await response.text();
        root.querySelectorAll("script").forEach((oldScript) => {
          const script = document.createElement("script");
          Array.from(oldScript.attributes).forEach((attr) => script.setAttribute(attr.name, attr.value));
          script.text = oldScript.text;
          oldScript.replaceWith(script);
        });
      } catch (error) {
        root.innerHTML = '<div class="error">VIP 客户端原型加载失败，请检查 assets/vip-br-prototype.fragment.html 是否存在。</div>';
      }
    }
    loadPrototype();
  </script>
</body>
</html>
