<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>返水模块文档</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #667085;
      --line: #e5e7ef;
      --blue: #1266d6;
      --blue-soft: #eaf2ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .wrap { max-width: 1040px; margin: 0 auto; padding: 48px 24px; }
    header { margin-bottom: 24px; }
    .eyebrow { color: var(--blue); font-weight: 700; margin-bottom: 8px; }
    h1 { margin: 0 0 12px; font-size: 34px; line-height: 1.2; letter-spacing: 0; }
    .summary { max-width: 760px; color: var(--muted); font-size: 16px; margin: 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-top: 28px; }
    .card { display: block; min-height: 150px; padding: 22px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); text-decoration: none; color: inherit; transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease; }
    .card:hover { transform: translateY(-2px); border-color: #b7cff4; box-shadow: 0 12px 28px rgba(21, 35, 70, .08); }
    .tag { display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 999px; color: var(--blue); background: var(--blue-soft); font-weight: 700; font-size: 12px; margin-bottom: 16px; }
    h2 { margin: 0 0 8px; font-size: 18px; line-height: 1.3; letter-spacing: 0; }
    .card p { margin: 0; color: var(--muted); }
    .note { margin-top: 28px; padding: 16px 18px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--muted); }
    .note a { color: var(--blue); text-decoration: none; font-weight: 700; }
    .note a:hover { text-decoration: underline; }
    footer { margin-top: 28px; color: #98a2b3; font-size: 13px; }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="eyebrow">项目 / 巴西站 / Rebate</div>
      <h1>返水模块文档</h1>
      <p class="summary">投注返水模块交付入口，包含 V1.5 PRD 与 pt-BR 客户端交互原型。</p>
    </header>

    <section class="grid" aria-label="交付文件">
      <a class="card" href="./rebate_prd.html">
        <span class="tag">PRD</span>
        <h2>返水模块 PRD</h2>
        <p>实时计算、手动领取模式，包含顶部汇总、Receber 弹窗、历史记录与边界状态说明。</p>
      </a>
      <a class="card" href="./rebate_prototype.html">
        <span class="tag">Prototype</span>
        <h2>交互原型</h2>
        <p>可点击 HTML 原型，覆盖返水首页、场馆详情、领取弹窗和 Histórico 页面。</p>
      </a>
    </section>

    <div class="note"><a href="../">返回巴西站项目文档</a></div>

    <footer>Updated: 2026-08-01</footer>
  </main>
</body>
</html>
